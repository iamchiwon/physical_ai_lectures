<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">언어·시각·행동 모델의 출력</title><desc id="desc">언어·시각·행동 모델의 출력: LLM 계획 → VLM 인지 → VLA 정책 → 실행 감독.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">언어·시각·행동 모델의 출력</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">LLM 계획</text><text x="52" y="144" font-size="22">작업/도구 호출의 후보</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">VLM 인지</text><text x="52" y="268" font-size="22">영상과 언어의 해석</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">VLA 정책</text><text x="52" y="392" font-size="22">정의된 공간의 행동 출력</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">실행 감독</text><text x="52" y="516" font-size="22">모델 출력과 별도로 권한/조건 확인</text></g></svg>