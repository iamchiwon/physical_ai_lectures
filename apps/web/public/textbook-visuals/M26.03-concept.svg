<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">전원·논리·물리 핀을 나누기</title><desc id="desc">전원·논리·물리 핀을 나누기: 전원 영역 → 논리 신호 → 회로 symbol → footprint → 제작 전 검수.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">전원·논리·물리 핀을 나누기</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">전원 영역</text><text x="52" y="144" font-size="22">전압·전류/열·귀환 경로</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">논리 신호</text><text x="52" y="268" font-size="22">논리 전압/허용 범위·pullup</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">회로 symbol → footprint</text><text x="52" y="392" font-size="22">핀 번호와 실제 pad/방향 대응</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">제작 전 검수</text><text x="52" y="516" font-size="22">ERC/DRC와 정격/배선 검토를 구별</text></g></svg>