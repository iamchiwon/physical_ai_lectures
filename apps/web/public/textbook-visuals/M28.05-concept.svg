<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">전송 끝과 검증 끝은 다르다</title><desc id="desc">전송 끝과 검증 끝은 다르다: 사전 대상/권한 → 다운로드/블록 전송 → 종료/검증 → 활성화/리셋 뒤 확인.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">전송 끝과 검증 끝은 다르다</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">사전 대상/권한</text><text x="52" y="144" font-size="22">HW/형상·이미지·복구 조건</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">다운로드/블록 전송</text><text x="52" y="268" font-size="22">길이·순서·응답을 대응</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">종료/검증</text><text x="52" y="392" font-size="22">수신 범위·무결성·신뢰·호환</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">활성화/리셋 뒤 확인</text><text x="52" y="516" font-size="22">현재 버전과 실제 상태를 새로 검증</text></g></svg>