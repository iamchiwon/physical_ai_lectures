<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">반전 때의 틈과 출력 지연</title><desc id="desc">치면 사이 틈 때문에입력반전이즉시출력운동이되지않는 국소개념도.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">반전 때의 틈과 출력 지연</text><rect x="60" y="220" width="210" height="95" fill="#dbeafe" stroke="#52647b" stroke-width="2"/><rect x="355" y="220" width="210" height="95" fill="#ffe6b6" stroke="#52647b" stroke-width="2"/><line x1="270" y1="255" x2="350" y2="255" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/><text x="280" y="215" font-size="21">틈</text><text x="90" y="350" font-size="21">입력 쪽 치면</text><text x="385" y="350" font-size="21">출력 쪽 치면</text><line x1="80" y1="160" x2="235" y2="160" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="65" y="120" font-size="21">방향 반전 뒤 틈을 건너는 구간</text><text x="45" y="430" font-size="21">입력 축 변화 ≠ 즉시 출력 축 변화</text></g></svg>