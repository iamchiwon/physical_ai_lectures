<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">회전과 직선 이동의 관절</title><desc id="desc">회전과 직선 이동의 관절: Revolute → Prismatic → Articulation Root → 별도 고정/드라이브.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">회전과 직선 이동의 관절</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">Revolute</text><text x="52" y="144" font-size="22">정한 로컬 축 주위 회전</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">Prismatic</text><text x="52" y="268" font-size="22">정한 로컬 축 방향 직선 이동</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">Articulation Root</text><text x="52" y="392" font-size="22">연결된 강체 계산 구조의 기준</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">별도 고정/드라이브</text><text x="52" y="516" font-size="22">월드 고정·목표·실제 관측은 구별</text></g></svg>