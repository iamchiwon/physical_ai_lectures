<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">명령과 통신을 감독하는 상태</title><desc id="desc">명령과 통신을 감독하는 상태: 상태별 출력 허용 → 명령 수신/검사 → 접수와 실행 감시 → 만료/고장/재개.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">명령과 통신을 감독하는 상태</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">상태별 출력 허용</text><text x="52" y="144" font-size="22">본문의 네 상태마다 권한 정의</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">명령 수신/검사</text><text x="52" y="268" font-size="22">형식·순서·lease·현재 상태 확인</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">접수와 실행 감시</text><text x="52" y="392" font-size="22">ACK는 물리 결과와 구별</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">만료/고장/재개</text><text x="52" y="516" font-size="22">새 근거와 복구 조건을 확인</text></g></svg>