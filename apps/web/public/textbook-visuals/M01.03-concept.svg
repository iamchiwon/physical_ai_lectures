<svg xmlns="http://www.w3.org/2000/svg" width="640" height="617" viewBox="0 0 640 617" role="img" aria-labelledby="title desc"><title id="title">버퍼 소유자와 소비자의 수명</title><desc id="desc">버퍼 소유자와 소비자의 수명: 소유자가 버퍼 생성 → 소비자에게 view 전달 → 소비 완료까지 유효성 유지 → 소유권 종료/재사용.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="617" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">버퍼 소유자와 소비자의 수명</text><rect x="34" y="80" width="558" height="123" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">소유자가 버퍼 생성</text><text x="52" y="144" font-size="22">주소·dtype·shape·stride를</text><text x="52" y="173" font-size="22">정의</text><path d="M314 205v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="233" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="266" font-size="24" font-weight="700">소비자에게 view 전달</text><text x="52" y="297" font-size="22">복사인지 공유인지 확인</text><path d="M314 329v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="357" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="390" font-size="24" font-weight="700">소비 완료까지 유효성 유지</text><text x="52" y="421" font-size="22">메모리 생존과 원본 값 보존을 구별</text><path d="M314 453v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="481" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="514" font-size="24" font-weight="700">소유권 종료/재사용</text><text x="52" y="545" font-size="22">아직 읽는 소비자가 없는지 확인</text></g></svg>