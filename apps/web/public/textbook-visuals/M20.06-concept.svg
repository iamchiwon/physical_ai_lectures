<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">증강 뒤에도 의미를 보존한다</title><desc id="desc">증강 뒤에도 의미를 보존한다: 원본 그룹 분리 → 조명/배경 변형 → 위치/카메라 변형 → 보류/재검사.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">증강 뒤에도 의미를 보존한다</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">원본 그룹 분리</text><text x="52" y="144" font-size="22">같은 원본/episode의 누수 방지</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">조명/배경 변형</text><text x="52" y="268" font-size="22">대상/지시문 의미 유지 여부</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">위치/카메라 변형</text><text x="52" y="392" font-size="22">기하·행동·라벨도 일치시킴</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">보류/재검사</text><text x="52" y="516" font-size="22">가림·미상·독립 평가 조건 보존</text></g></svg>