<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">영상 운동 추정의 두 잔차</title><desc id="desc">영상 운동 추정의 두 잔차: 특징 기반 → 직접법 → 공통 기하 → 실패 단서.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">영상 운동 추정의 두 잔차</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">특징 기반</text><text x="52" y="144" font-size="22">특징의 대응과 재투영 오차</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">직접법</text><text x="52" y="268" font-size="22">정렬된 위치의 밝기 차이</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">공통 기하</text><text x="52" y="392" font-size="22">카메라 모델·시각·척도 계약</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">실패 단서</text><text x="52" y="516" font-size="22">무늬/가림·노출·잘못된 대응</text></g></svg>