<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">구조화 출력 뒤에도 검사가 남는다</title><desc id="desc">구조화 출력 뒤에도 검사가 남는다: 모델의 후보 출력 → 스키마 검사 → 의미/권한/현재 상태 → Tool/ROS Action.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">구조화 출력 뒤에도 검사가 남는다</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">모델의 후보 출력</text><text x="52" y="144" font-size="22">신뢰되지 않은 입력 자료로 취급</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">스키마 검사</text><text x="52" y="268" font-size="22">필드/타입·허용값 검사</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">의미/권한/현재 상태</text><text x="52" y="392" font-size="22">대상·단위·시각·범위·허가</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">Tool/ROS Action</text><text x="52" y="516" font-size="22">실행 수락과 실제 결과를 추적</text></g></svg>