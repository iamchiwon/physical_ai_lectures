<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">느린 정책과 빠른 PD 루프</title><desc id="desc">느린 정책과 빠른 PD 루프: 정책 갱신 → 목표 유지/보간 → 빠른 PD 갱신 → 최종 제한/실행.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">느린 정책과 빠른 PD 루프</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">정책 갱신</text><text x="52" y="144" font-size="22">새 관측에서 관절 목표를 계산</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">목표 유지/보간</text><text x="52" y="268" font-size="22">정책 사이 구간의 규칙</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">빠른 PD 갱신</text><text x="52" y="392" font-size="22">현재 관절 상태로 토크 요구</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">최종 제한/실행</text><text x="52" y="516" font-size="22">계층별 포화·지연·전환을 검수</text></g></svg>