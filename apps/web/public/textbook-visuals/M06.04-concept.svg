<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">펼친 팔에서 잃는 순간 운동 방향</title><desc id="desc">평면의 두 회전 관절, 두 링크와 베이스 기준축.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">펼친 팔에서 잃는 순간 운동 방향</text><line x1="100" y1="400" x2="580" y2="400" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><line x1="100" y1="400" x2="100" y2="70" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><text x="575" y="432" font-size="21">x</text><text x="62" y="80" font-size="21">y</text><line x1="100" y1="400" x2="340" y2="400" stroke="#2563eb" stroke-width="9"/><line x1="340" y1="400" x2="500" y2="400" stroke="#059669" stroke-width="9"/><circle cx="100" cy="400" r="7" fill="#17283e" fill-opacity="1" stroke="#17283e"/><circle cx="340" cy="400" r="7" fill="#17283e" fill-opacity="1" stroke="#17283e"/><circle cx="500" cy="400" r="7" fill="#17283e" fill-opacity="1" stroke="#17283e"/><text x="170" y="380" font-size="21">L1=0.3 m</text><text x="350" y="380" font-size="21">L2=0.2 m</text><line x1="500" y1="380" x2="500" y2="240" stroke="#059669" stroke-width="4" marker-end="url(#a)"/><text x="345" y="212" font-size="21">순간 y방향 속도</text><text x="140" y="140" font-size="21">q1=q2=0: x방향 1차 속도는 0</text><text x="140" y="180" font-size="21">도달 가능과 특이점 여부는 다른 질문</text><text x="85" y="456" font-size="20">+z에서 본 평면: 길이·좌표는 m</text></g></svg>