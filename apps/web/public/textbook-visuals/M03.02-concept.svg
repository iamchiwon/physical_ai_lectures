<svg xmlns="http://www.w3.org/2000/svg" width="640" height="633" viewBox="0 0 640 633" role="img" aria-labelledby="title desc"><title id="title">제어 신호와 동력 경로</title><desc id="desc">제어 신호와 동력 경로: 제어기 → 드라이버 → 모터·기구 → 엔코더 피드백.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="633" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">제어 신호와 동력 경로</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">제어기</text><text x="52" y="144" font-size="22">목표·측정으로 명령을 계산</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">드라이버</text><text x="52" y="268" font-size="22">전원에서 모터로 전력을 제어</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">모터·기구</text><text x="52" y="392" font-size="22">전류·부하에 따라 실제 운동</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">엔코더 피드백</text><text x="52" y="516" font-size="22">측정 축·기어비·영점을 확인</text><path d="M592 501h25V123h-22" fill="none" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><text x="34" y="611" font-size="20">새 관측을 다음 판단으로 되돌림</text></g></svg>