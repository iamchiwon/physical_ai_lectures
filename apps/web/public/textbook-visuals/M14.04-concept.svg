<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">칼만 필터의 예측과 갱신</title><desc id="desc">칼만 필터의 예측과 갱신: 이전 추정/공분산 → 모형 예측 → 관측 비교/갱신 → 새 추정.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">칼만 필터의 예측과 갱신</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">이전 추정/공분산</text><text x="52" y="144" font-size="22">상태 예상값과 불확실성</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">모형 예측</text><text x="52" y="268" font-size="22">동역학과 Q로 다음 상태를 예상</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">관측 비교/갱신</text><text x="52" y="392" font-size="22">혁신·R·Kalman gain으로 수정</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">새 추정</text><text x="52" y="516" font-size="22">계산된 확신과 실제 정확도를 구별</text></g></svg>