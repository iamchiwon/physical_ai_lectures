<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">경로 탐색의 비용과 추정</title><desc id="desc">경로 탐색의 비용과 추정: 지금까지 비용 g → 남은 비용 추정 h → A* 우선순위 f = g + h → 결과 경로.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">경로 탐색의 비용과 추정</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">지금까지 비용 g</text><text x="52" y="144" font-size="22">시작점에서 현재 노드까지</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">남은 비용 추정 h</text><text x="52" y="268" font-size="22">목표까지의 휴리스틱</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">A* 우선순위 f = g + h</text><text x="52" y="392" font-size="22">추정의 조건/탐색 규칙을 함께 확인</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">결과 경로</text><text x="52" y="516" font-size="22">충돌·비용·연결 가정 안의 결과</text></g></svg>