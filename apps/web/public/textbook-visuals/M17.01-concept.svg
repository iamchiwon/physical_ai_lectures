<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">원판 로봇의 C-space 장애물</title><desc id="desc">반지름.3m 장애물을 로봇 반지름.2m만큼 확장하고중심점으로충돌검사.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">원판 로봇의 C-space 장애물</text><circle cx="320" cy="245" r="150" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24"/><circle cx="320" cy="245" r="90" fill="#d97706" fill-opacity="0.65" stroke="#d97706"/><circle cx="500" cy="245" r="60" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb"/><circle cx="500" cy="245" r="5" fill="#2563eb" fill-opacity="1" stroke="#2563eb"/><line x1="320" y1="245" x2="410" y2="245" stroke="#52647b" stroke-width="3"/><text x="310" y="230" font-size="21">R=0.3</text><text x="443" y="335" font-size="21">r=0.2</text><text x="95" y="95" font-size="21">장애물 중심 c=(1,1) m</text><text x="75" y="396" font-size="21">확장 반경 R+r=0.5 m</text><text x="75" y="432" font-size="21">로봇 중심 q=(1.6,1) m, 기하 여유 0.1 m</text></g></svg>