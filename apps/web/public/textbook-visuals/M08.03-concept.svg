<svg xmlns="http://www.w3.org/2000/svg" width="640" height="617" viewBox="0 0 640 617" role="img" aria-labelledby="title desc"><title id="title">링크 트리와 mimic 의존성</title><desc id="desc">링크 트리와 mimic 의존성: 링크/관절 트리 → mimic 값 의존성 → 검사 대상 → 명령 해석.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="617" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">링크 트리와 mimic 의존성</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">링크/관절 트리</text><text x="52" y="144" font-size="22">부모 링크 → 관절 → 자식 링크</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">mimic 값 의존성</text><text x="52" y="268" font-size="22">다른 관절값을 배율/오프셋으로 참조</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">검사 대상</text><text x="52" y="392" font-size="22">연결 순환과 값 의존성 순환은 별개</text><rect x="34" y="452" width="558" height="123" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">명령 해석</text><text x="52" y="516" font-size="22">mimic을 독립 모터 명령으로 더하지</text><text x="52" y="545" font-size="22">않음</text></g></svg>