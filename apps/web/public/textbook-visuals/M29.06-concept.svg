<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">주차 공간과 차체 전체의 여유</title><desc id="desc">5x2.5m 공간에 중심/축이일치하는4x2m 차체와 앞뒤.5m좌우.25m 여유.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">주차 공간과 차체 전체의 여유</text><rect x="65" y="135" width="500" height="250" fill="#e1f4ed" stroke="#52647b" stroke-width="2"/><rect x="115" y="160" width="400" height="200" fill="#dbeafe" stroke="#52647b" stroke-width="2"/><text x="260" y="262" font-size="21">차체 4 × 2 m</text><text x="240" y="113" font-size="21">공간 5 × 2.5 m</text><line x1="65" y1="405" x2="115" y2="405" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><text x="51" y="443" font-size="21">0.5 m</text><line x1="585" y1="135" x2="585" y2="160" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><text x="480" y="90" font-size="21">측면 0.25 m</text><text x="60" y="466" font-size="19">회전·경로·위치 오차·불확실성을 제외한 정렬 예</text></g></svg>