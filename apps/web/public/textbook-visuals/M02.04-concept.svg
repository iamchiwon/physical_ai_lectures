<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">공분산은 함께 변하는 방향이다</title><desc id="desc">양의 상관의 기울어진 타원과 음의 상관의 반대 기울기 타원.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">공분산은 함께 변하는 방향이다</text><line x1="60" y1="360" x2="580" y2="360" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><line x1="90" y1="420" x2="90" y2="90" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><text x="568" y="392" font-size="21">오차 x</text><text x="22" y="87" font-size="21">오차 y</text><ellipse cx="260" cy="240" rx="110" ry="34" transform="rotate(-35 260 240)" fill="#dceaff" stroke="#2563eb" stroke-width="3"/><ellipse cx="470" cy="240" rx="100" ry="34" transform="rotate(35 470 240)" fill="#fff1dc" stroke="#d97706" stroke-width="3"/><text x="185" y="133" font-size="21">양의 상관</text><text x="427" y="133" font-size="21">음의 상관</text><text x="75" y="453" font-size="19">타원은 방향의 개념도: 확률 수준은 지정하지 않음</text></g></svg>