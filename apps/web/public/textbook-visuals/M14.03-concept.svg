<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">시각 짝짓기와 보간은 다르다</title><desc id="desc">시각 짝짓기와 보간은 다르다: 시간원 정합 → 메시지 짝짓기 → 상태 보간 → 별도 검증.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">시각 짝짓기와 보간은 다르다</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">시간원 정합</text><text x="52" y="144" font-size="22">서로 다른 clock의 기준/오차</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">메시지 짝짓기</text><text x="52" y="268" font-size="22">허용 시차 안의 기존 표본 선택</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">상태 보간</text><text x="52" y="392" font-size="22">두 표본 사이의 값을 모델로 계산</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">별도 검증</text><text x="52" y="516" font-size="22">새로 측정한 사실로 바꾸지 않음</text></g></svg>