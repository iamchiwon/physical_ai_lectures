<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">한 링크에 붙는 세 가지 모델</title><desc id="desc">한 링크에 붙는 세 가지 모델: visual → collision → inertial → 공통 링크 프레임.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">한 링크에 붙는 세 가지 모델</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">visual</text><text x="52" y="144" font-size="22">보이는 형상·재질과 원점</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">collision</text><text x="52" y="268" font-size="22">충돌 계산 형상과 별도 원점</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">inertial</text><text x="52" y="392" font-size="22">질량·COM·관성의 기준과 축</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">공통 링크 프레임</text><text x="52" y="516" font-size="22">세 요소가 같다고 자동 가정하지 않음</text></g></svg>