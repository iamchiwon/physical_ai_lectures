<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">TF·표시·기록의 다른 역할</title><desc id="desc">TF·표시·기록의 다른 역할: TF → RViz → rqt → rosbag2/MCAP.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">TF·표시·기록의 다른 역할</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">TF</text><text x="52" y="144" font-size="22">프레임 사이 변환과 시각</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">RViz</text><text x="52" y="268" font-size="22">선택한 자료/변환을 화면에 표시</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">rqt</text><text x="52" y="392" font-size="22">연결·상태 진단의 관찰 도구</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">rosbag2/MCAP</text><text x="52" y="516" font-size="22">선택한 토픽/시각을 기록·재생</text></g></svg>