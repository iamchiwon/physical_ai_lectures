<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">보기 좋은 자산과 물리 자산</title><desc id="desc">보기 좋은 자산과 물리 자산: 외형/재질 → 단위/계층 → 충돌/질량/관성 → 구동/센서.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">보기 좋은 자산과 물리 자산</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">외형/재질</text><text x="52" y="144" font-size="22">렌더링의 형상·색</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">단위/계층</text><text x="52" y="268" font-size="22">실제 크기와 변환의 적용 범위</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">충돌/질량/관성</text><text x="52" y="392" font-size="22">물리 계산의 형상·파라미터</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">구동/센서</text><text x="52" y="516" font-size="22">접촉·관절·관측의 별도 검수</text></g></svg>