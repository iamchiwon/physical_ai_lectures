<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">2R 팔: 상대각과 링크 길이</title><desc id="desc">평면의 두 회전 관절, 두 링크와 베이스 기준축.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">2R 팔: 상대각과 링크 길이</text><line x1="100" y1="400" x2="580" y2="400" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><line x1="100" y1="400" x2="100" y2="70" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><text x="575" y="432" font-size="21">x</text><text x="62" y="80" font-size="21">y</text><line x1="100" y1="400" x2="340" y2="400" stroke="#2563eb" stroke-width="9"/><line x1="340" y1="400" x2="340" y2="240" stroke="#059669" stroke-width="9"/><circle cx="100" cy="400" r="7" fill="#17283e" fill-opacity="1" stroke="#17283e"/><circle cx="340" cy="400" r="7" fill="#17283e" fill-opacity="1" stroke="#17283e"/><circle cx="340" cy="240" r="7" fill="#17283e" fill-opacity="1" stroke="#17283e"/><text x="170" y="380" font-size="21">L1=0.3 m</text><text x="350" y="310" font-size="21">L2=0.2 m</text><text x="110" y="100" font-size="21">q1=0°, q2=90°</text><text x="350" y="215" font-size="21">말단 (0.3, 0.2) m</text><text x="220" y="290" font-size="21">q2는 상대각</text><path d="M380 400 A40 40 0 0 0 340 360" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/><text x="85" y="456" font-size="20">+z에서 본 평면: 길이·좌표는 m</text></g></svg>