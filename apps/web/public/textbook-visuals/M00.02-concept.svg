<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">세계·관측·추정·명령은 다른 값이다</title><desc id="desc">세계·관측·추정·명령은 다른 값이다: 세계의 상태 → 관측 → 추정 → 행동 명령.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">세계·관측·추정·명령은 다른 값이다</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">세계의 상태</text><text x="52" y="144" font-size="22">위치·속도·접촉 등 필요한 실제 변수</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">관측</text><text x="52" y="268" font-size="22">센서가 보낸 값과 측정 시각</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">추정</text><text x="52" y="392" font-size="22">관측과 모델로 계산한 상태 예상</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">행동 명령</text><text x="52" y="516" font-size="22">다음 목표이며 실제 결과와 구별</text></g></svg>