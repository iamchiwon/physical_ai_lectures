<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">한 링크의 중력 방향과 토크</title><desc id="desc">고정 회전축에서 길이 l의 질점 링크, 수평 기준 q와 아래 방향 mg.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">한 링크의 중력 방향과 토크</text><line x1="100" y1="370" x2="540" y2="370" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><line x1="100" y1="370" x2="365" y2="210" stroke="#2563eb" stroke-width="9"/><circle cx="100" cy="370" r="9" fill="#17283e" fill-opacity="1" stroke="#17283e"/><circle cx="365" cy="210" r="16" fill="#2563eb" fill-opacity="1" stroke="#2563eb"/><line x1="365" y1="228" x2="365" y2="340" stroke="#d97706" stroke-width="4" marker-end="url(#a)"/><text x="380" y="300" font-size="21">mg</text><text x="240" y="235" font-size="21">l</text><text x="140" y="345" font-size="21">q</text><text x="335" y="150" font-size="21">질점 m</text><text x="85" y="90" font-size="21">q는 수평에서 반시계 방향</text><text x="85" y="440" font-size="21">중력 토크 = −mgl cos q</text></g></svg>