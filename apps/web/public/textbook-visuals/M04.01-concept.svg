<svg xmlns="http://www.w3.org/2000/svg" width="640" height="617" viewBox="0 0 640 617" role="img" aria-labelledby="title desc"><title id="title">메모리 영역은 역할이 다르다</title><desc id="desc">메모리 영역은 역할이 다르다: Flash → SRAM → EEPROM → 레지스터/I/O.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="617" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">메모리 영역은 역할이 다르다</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">Flash</text><text x="52" y="144" font-size="22">프로그램과 초기값 이미지</text><rect x="34" y="204" width="558" height="123" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">SRAM</text><text x="52" y="268" font-size="22">실행 중</text><text x="52" y="297" font-size="22">data/bss·heap·stack</text><rect x="34" y="357" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="390" font-size="24" font-weight="700">EEPROM</text><text x="52" y="421" font-size="22">지속 설정과 쓰기 수명</text><rect x="34" y="481" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="514" font-size="24" font-weight="700">레지스터/I/O</text><text x="52" y="545" font-size="22">CPU 연산과 주변장치 제어를 구별</text></g></svg>