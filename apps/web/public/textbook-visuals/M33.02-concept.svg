<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">기체 자세와 카메라 시점을 나누기</title><desc id="desc">기체 자세와 카메라 시점을 나누기: Roll/Pitch/Yaw → 각도형 지령 → Rate형 지령 → 카메라 장착 각.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">기체 자세와 카메라 시점을 나누기</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">Roll/Pitch/Yaw</text><text x="52" y="144" font-size="22">기체의 회전 축/각도 계약</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">각도형 지령</text><text x="52" y="268" font-size="22">스틱이 자세 목표를 뜻할 수 있음</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">Rate형 지령</text><text x="52" y="392" font-size="22">스틱이 각속도 목표를 뜻할 수 있음</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">카메라 장착 각</text><text x="52" y="516" font-size="22">화면 수평선과 기체 자세는 구별</text></g></svg>