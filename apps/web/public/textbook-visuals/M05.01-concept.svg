<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">콜백 실행 전까지의 경로</title><desc id="desc">콜백 실행 전까지의 경로: 센서 메시지 발행 → 미들웨어 수신/대기 → Executor가 작업 선택 → 사용자 콜백.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">콜백 실행 전까지의 경로</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">센서 메시지 발행</text><text x="52" y="144" font-size="22">타입·토픽·측정 시각</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">미들웨어 수신/대기</text><text x="52" y="268" font-size="22">QoS와 큐가 수신 조건을 정함</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">Executor가 작업 선택</text><text x="52" y="392" font-size="22">도착 즉시 실행되는 것은 아님</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">사용자 콜백</text><text x="52" y="516" font-size="22">관측의 나이와 실제 처리 시각 확인</text></g></svg>