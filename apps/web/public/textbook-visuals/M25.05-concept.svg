<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">합성 영상과 라벨을 같은 관측으로</title><desc id="desc">합성 영상과 라벨을 같은 관측으로: 장면/랜덤 seed → Capture 시각 → 영상/깊이/라벨 → Writer/파일 검수.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">합성 영상과 라벨을 같은 관측으로</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">장면/랜덤 seed</text><text x="52" y="144" font-size="22">물체·재질·조명·카메라 조건</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">Capture 시각</text><text x="52" y="268" font-size="22">같은 장면 상태의 관측</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">영상/깊이/라벨</text><text x="52" y="392" font-size="22">ID·기하·해상도·정의를 연결</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">Writer/파일 검수</text><text x="52" y="516" font-size="22">완료/누락과 그룹 분할을 확인</text></g></svg>