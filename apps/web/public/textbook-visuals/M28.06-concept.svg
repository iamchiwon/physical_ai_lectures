<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">메타데이터와 실제 계측 경로</title><desc id="desc">메타데이터와 실제 계측 경로: A2L/빌드 계약 → 폴링 → DAQ → 해석/보존.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">메타데이터와 실제 계측 경로</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">A2L/빌드 계약</text><text x="52" y="144" font-size="22">주소·형식·단위·변환/버전</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">폴링</text><text x="52" y="268" font-size="22">요청 순서에 따른 시각 차이</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">DAQ</text><text x="52" y="392" font-size="22">ECU 이벤트와 취득 구성을 연결</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">해석/보존</text><text x="52" y="516" font-size="22">읽은 페이지·적용 페이지·누락 구별</text></g></svg>