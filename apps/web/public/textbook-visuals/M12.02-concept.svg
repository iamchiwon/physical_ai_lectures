<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">한 픽셀에 겹치는 같은 광선의 점</title><desc id="desc">카메라 중심과 앞쪽 가상 영상 평면, 같은 광선 위의 두 점.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">한 픽셀에 겹치는 같은 광선의 점</text><line x1="75" y1="350" x2="585" y2="350" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><text x="575" y="381" font-size="21">+Z</text><line x1="75" y1="350" x2="75" y2="100" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><text x="20" y="97" font-size="21">+X</text><line x1="245" y1="125" x2="245" y2="370" stroke="#d97706" stroke-width="3"/><text x="176" y="99" font-size="21">가상 영상 평면</text><line x1="75" y1="350" x2="550" y2="112" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><circle cx="405" cy="185" r="8" fill="#2563eb" fill-opacity="1" stroke="#2563eb"/><circle cx="520" cy="127.5" r="8" fill="#2563eb" fill-opacity="1" stroke="#2563eb"/><circle cx="245" cy="265" r="7" fill="#d97706" fill-opacity="1" stroke="#d97706"/><text x="319" y="215" font-size="21">P</text><text x="518" y="99" font-size="21">2P</text><text x="250" y="297" font-size="21">같은 픽셀</text><text x="45" y="388" font-size="21">카메라 중심</text><text x="75" y="449" font-size="19">앞쪽 영상면의 X/Z 단면: 실제 센서 배치는 생략</text></g></svg>