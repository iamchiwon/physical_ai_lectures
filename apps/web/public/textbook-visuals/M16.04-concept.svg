<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">Factor graph의 두 종류 요소</title><desc id="desc">Factor graph의 두 종류 요소: 변수 노드 → Factor → 연결 → 기준 고정.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">Factor graph의 두 종류 요소</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">변수 노드</text><text x="52" y="144" font-size="22">추정할 pose·랜드마크·bias 등</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">Factor</text><text x="52" y="268" font-size="22">관측/모형이 주는 잔차와 불확실성</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">연결</text><text x="52" y="392" font-size="22">어떤 변수들이 같은 잔차에 참여하는가</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">기준 고정</text><text x="52" y="516" font-size="22">전체 좌표가 함께 움직이는 자유도 제거</text></g></svg>