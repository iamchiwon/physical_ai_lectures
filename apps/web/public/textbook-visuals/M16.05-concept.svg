<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">비슷한 장면을 루프로 확정하지 않기</title><desc id="desc">비슷한 장면을 루프로 확정하지 않기: 장소 후보 검색 → 기하 검증 → 제약 수락/보류 → 백엔드 재평가.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">비슷한 장면을 루프로 확정하지 않기</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">장소 후보 검색</text><text x="52" y="144" font-size="22">외형 유사성은 후보 근거</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">기하 검증</text><text x="52" y="268" font-size="22">대응·이동/시각·일관성 확인</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">제약 수락/보류</text><text x="52" y="392" font-size="22">오검출과 누락 비용을 구별</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">백엔드 재평가</text><text x="52" y="516" font-size="22">틀린 제약이 전체 지도에 미치는 영향</text></g></svg>