<svg xmlns="http://www.w3.org/2000/svg" width="640" height="696" viewBox="0 0 640 696" role="img" aria-labelledby="title desc"><title id="title">명령 뒤 결과가 다음 판단으로 돌아오는 폐루프</title><desc id="desc">관측, 판단, 행동과 세계 변화, 새 관측으로 이어지고 새 관측이 다음 판단에 되돌아가는 폐루프.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="696" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">명령 뒤 결과가 다음 판단으로 돌아오는</text><text x="28" y="76" font-size="26" font-weight="700">폐루프</text><rect x="34" y="114" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="147" font-size="24" font-weight="700">관측</text><text x="52" y="178" font-size="22">센서가 현재 장면·측정 시각을 전달한다</text><path d="M314 210v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="238" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="271" font-size="24" font-weight="700">판단</text><text x="52" y="302" font-size="22">목표와 관측을 비교해 다음 행동을 고른다</text><path d="M314 334v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="362" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="395" font-size="24" font-weight="700">행동과 세계 변화</text><text x="52" y="426" font-size="22">실행 결과는 명령의 목표와 다를 수 있다</text><path d="M314 458v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="486" width="558" height="123" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="519" font-size="24" font-weight="700">새 관측</text><text x="52" y="550" font-size="22">변한 위치·접촉·관측의 최신성을 다시</text><text x="52" y="579" font-size="22">확인한다</text><path d="M592 564h25V157h-22" fill="none" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><text x="34" y="674" font-size="20">새 관측을 다음 판단으로 되돌림</text></g></svg>