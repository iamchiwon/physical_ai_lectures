<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" role="img" aria-labelledby="title desc"><title id="title">명령 뒤 결과가 다음 판단으로 돌아오는 폐루프</title><desc id="desc">관측, 판단, 행동과 세계 변화, 새 관측으로 이어지고 새 관측이 다음 판단에 되돌아가는 폐루프.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="960" height="624" rx="24" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="48" y="54" font-size="29" font-weight="700">명령 뒤 결과가 다음 판단으로 돌아오는 폐루프</text><rect x="70" y="86" width="820" height="84" rx="14" fill="#e4efff" stroke="#bdcbdc"/><text x="94" y="119" font-size="25" font-weight="700">관측</text><text x="94" y="149" font-size="21">센서가 현재 장면·측정 시각을 전달한다</text><path d="M480 172v22" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="198" width="820" height="84" rx="14" fill="#e4f4ee" stroke="#bdcbdc"/><text x="94" y="231" font-size="25" font-weight="700">판단</text><text x="94" y="261" font-size="21">목표와 관측을 비교해 다음 행동을 고른다</text><path d="M480 284v22" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="310" width="820" height="84" rx="14" fill="#fff1dc" stroke="#bdcbdc"/><text x="94" y="343" font-size="25" font-weight="700">행동과 세계 변화</text><text x="94" y="373" font-size="21">실행 결과는 명령의 목표와 다를 수 있다</text><path d="M480 396v22" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="422" width="820" height="84" rx="14" fill="#eeeafa" stroke="#bdcbdc"/><text x="94" y="455" font-size="25" font-weight="700">새 관측</text><text x="94" y="485" font-size="21">변한 위치·접촉·관측의 최신성을 다시 확인한다</text><path d="M890 466h36V128h-32" fill="none" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><text x="94" y="598" font-size="21">결과의 새 관측을 다음 판단에 되돌린다</text></g></svg>