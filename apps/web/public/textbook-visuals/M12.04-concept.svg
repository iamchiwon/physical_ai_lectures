<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Semantic과 Instance의 다른 색 의미</title><desc id="desc">같은 두 자동차가 semantic에서는 같은 색,instance에서는 개체별 다른 색인 자체 합성 도식.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">Semantic과 Instance의 다른 색 의미</text><text x="40" y="100" font-size="21">Semantic: 클래스</text><rect x="40" y="125" width="255" height="230" fill="#e2e8f0" stroke="#52647b" stroke-width="2"/><rect x="75" y="220" width="78" height="40" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="90" y="195" width="45" height="25" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><circle cx="90" cy="264" r="8" fill="#17283e" fill-opacity="1" stroke="#17283e"/><circle cx="137" cy="264" r="8" fill="#17283e" fill-opacity="1" stroke="#17283e"/><rect x="185" y="220" width="78" height="40" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="200" y="195" width="45" height="25" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><circle cx="200" cy="264" r="8" fill="#17283e" fill-opacity="1" stroke="#17283e"/><circle cx="247" cy="264" r="8" fill="#17283e" fill-opacity="1" stroke="#17283e"/><text x="340" y="100" font-size="21">Instance: 개체</text><rect x="340" y="125" width="255" height="230" fill="#e2e8f0" stroke="#52647b" stroke-width="2"/><rect x="375" y="220" width="78" height="40" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><rect x="390" y="195" width="45" height="25" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><circle cx="390" cy="264" r="8" fill="#17283e" fill-opacity="1" stroke="#17283e"/><circle cx="437" cy="264" r="8" fill="#17283e" fill-opacity="1" stroke="#17283e"/><rect x="485" y="220" width="78" height="40" fill="#d97706" stroke="#d97706" stroke-width="2"/><rect x="500" y="195" width="45" height="25" fill="#d97706" stroke="#d97706" stroke-width="2"/><circle cx="500" cy="264" r="8" fill="#17283e" fill-opacity="1" stroke="#17283e"/><circle cx="547" cy="264" r="8" fill="#17283e" fill-opacity="1" stroke="#17283e"/><text x="65" y="400" font-size="21">두 물체 모두 car</text><text x="360" y="400" font-size="21">car#1 / car#2</text><text x="38" y="449" font-size="19">색은 표시 약속: 다음 프레임의 ID 유지는 별도 검증</text></g></svg>