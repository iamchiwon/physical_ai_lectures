<svg xmlns="http://www.w3.org/2000/svg" width="640" height="617" viewBox="0 0 640 617" role="img" aria-labelledby="title desc"><title id="title">Costmap의 공간 표현</title><desc id="desc">Costmap의 공간 표현: 정적 지도/실시간 관측 → 장애물 layer → Inflation → 계획/제어의 소비.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="617" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">Costmap의 공간 표현</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">정적 지도/실시간 관측</text><text x="52" y="144" font-size="22">출처·시각·좌표를 맞춤</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">장애물 layer</text><text x="52" y="268" font-size="22">관측을 표시/해제하는 규칙</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="123" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">Inflation</text><text x="52" y="392" font-size="22">거리와 footprint 조건으로 비용</text><text x="52" y="421" font-size="22">확장</text><path d="M314 453v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="481" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="514" font-size="24" font-weight="700">계획/제어의 소비</text><text x="52" y="545" font-size="22">지도 비용이 실제 안전 인증은 아님</text></g></svg>