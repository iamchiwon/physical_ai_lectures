<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">동적 장애물은 시간까지 비교</title><desc id="desc">동적 장애물은 시간까지 비교: 차량 후보 궤적 → 장애물 예측 → 시간을 맞춘 충돌 검사 → 제어/재계획.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">동적 장애물은 시간까지 비교</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">차량 후보 궤적</text><text x="52" y="144" font-size="22">시각별 차체 위치/형상</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">장애물 예측</text><text x="52" y="268" font-size="22">같은 시각의 위치/불확실성</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">시간을 맞춘 충돌 검사</text><text x="52" y="392" font-size="22">공간 교차만으로 충돌을 확정하지 않음</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">제어/재계획</text><text x="52" y="516" font-size="22">관측 나이·적용/제동 지연을 반영</text></g></svg>