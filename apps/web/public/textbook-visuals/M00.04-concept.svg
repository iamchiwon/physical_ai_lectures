<svg xmlns="http://www.w3.org/2000/svg" width="640" height="464" viewBox="0 0 640 464" role="img" aria-labelledby="title desc"><title id="title">주기와 한 표본의 지연을 나누기</title><desc id="desc">주기와 한 표본의 지연을 나누기: 시작 간격 P → 표본의 직렬 처리 L → 마감 여유.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="464" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">주기와 한 표본의 지연을 나누기</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">시작 간격 P</text><text x="52" y="144" font-size="22">20 Hz의 계획 간격은 50 ms</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">표본의 직렬 처리 L</text><text x="52" y="268" font-size="22">센서부터 적용·대기까지 48 ms</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">마감 여유</text><text x="52" y="392" font-size="22">이번 직렬 예제의 여유는 2 ms</text></g></svg>