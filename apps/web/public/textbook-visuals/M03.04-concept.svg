<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">명령선과 전력 경로를 구별</title><desc id="desc">명령선과 전력 경로를 구별: 신호 경로 → 전력 경로 → 기준 전위 → 별도 검사.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">명령선과 전력 경로를 구별</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">신호 경로</text><text x="52" y="144" font-size="22">MCU → 드라이버의 논리 입력</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">전력 경로</text><text x="52" y="268" font-size="22">전원 → 드라이버 → 부하</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">기준 전위</text><text x="52" y="392" font-size="22">신호 기준과 귀환 전류 경로 확인</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">별도 검사</text><text x="52" y="516" font-size="22">논리 전압·전류·열·차단 조건</text></g></svg>