<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">두 시점의 광선으로 점을 제약</title><desc id="desc">두 카메라 중심 사이 baseline과 같은 물리점으로 향하는 광선의 교차.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">두 시점의 광선으로 점을 제약</text><circle cx="150" cy="385" r="10" fill="#17283e" fill-opacity="1" stroke="#17283e"/><circle cx="490" cy="385" r="10" fill="#17283e" fill-opacity="1" stroke="#17283e"/><circle cx="340" cy="140" r="9" fill="#2563eb" fill-opacity="1" stroke="#2563eb"/><line x1="150" y1="385" x2="340" y2="140" stroke="#2563eb" stroke-width="3"/><line x1="490" y1="385" x2="340" y2="140" stroke="#d97706" stroke-width="3"/><line x1="150" y1="415" x2="490" y2="415" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><text x="85" y="370" font-size="21">왼쪽 카메라</text><text x="423" y="370" font-size="21">오른쪽 카메라</text><text x="260" y="448" font-size="21">baseline B</text><text x="354" y="135" font-size="21">같은 점 P</text><text x="60" y="90" font-size="21">대응·상대 회전/이동·내부 보정이 필요</text></g></svg>