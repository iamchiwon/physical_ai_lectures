<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">CAN의 층과 공통 버스</title><desc id="desc">CAN의 층과 공통 버스: 응용/메시지 계약 → CAN 제어기 → 트랜시버 → 버스/종단.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">CAN의 층과 공통 버스</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">응용/메시지 계약</text><text x="52" y="144" font-size="22">신호 의미·ID·주기·유효성</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">CAN 제어기</text><text x="52" y="268" font-size="22">프레임·중재·오류 상태</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">트랜시버</text><text x="52" y="392" font-size="22">논리와 차동 선로의 경계</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">버스/종단</text><text x="52" y="516" font-size="22">노드 수와 선로 양끝을 구별</text></g></svg>