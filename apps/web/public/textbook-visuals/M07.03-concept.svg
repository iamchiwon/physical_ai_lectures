<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">PID와 포화 후 적분 처리</title><desc id="desc">PID와 포화 후 적분 처리: 목표/측정의 오차 → P·I·D 항 계산 → 출력 범위 제한 → 적분 상태 갱신.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">PID와 포화 후 적분 처리</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">목표/측정의 오차</text><text x="52" y="144" font-size="22">각 시각의 e와 간격 T</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">P·I·D 항 계산</text><text x="52" y="268" font-size="22">적분 상태와 미분 규칙을 명시</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">출력 범위 제한</text><text x="52" y="392" font-size="22">원래 요구와 적용값을 구별</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">적분 상태 갱신</text><text x="52" y="516" font-size="22">포화 때의 anti-windup 규칙 확인</text></g></svg>