<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">조립 공차와 지지 영역은 다른 검사</title><desc id="desc">단면의 보드/브래킷 여유와위에서본지지영역의COM투영위치.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">조립 공차와 지지 영역은 다른 검사</text><text x="40" y="95" font-size="21">단면: 조립 여유</text><rect x="50" y="135" width="250" height="120" fill="#dbeafe" stroke="#52647b" stroke-width="2"/><rect x="78" y="155" width="194" height="80" fill="#94a3b8" stroke="#52647b" stroke-width="2"/><text x="72" y="300" font-size="21">안쪽 폭 G / 판 폭 W</text><text x="360" y="95" font-size="21">위에서 본 지지 영역</text><rect x="365" y="140" width="200" height="170" fill="#e1f4ed" stroke="#52647b" stroke-width="2"/><circle cx="480" cy="210" r="8" fill="#2563eb" fill-opacity="1" stroke="#2563eb"/><line x1="480" y1="170" x2="480" y2="250" stroke="#52647b" stroke-width="3"/><line x1="440" y1="210" x2="520" y2="210" stroke="#52647b" stroke-width="3"/><text x="400" y="350" font-size="21">COM의 수직 투영</text><text x="45" y="422" font-size="21">명목 간격 G−W와 최악 공차를 구별</text><text x="45" y="454" font-size="20">지지 영역은 실제 접촉 조건에서 따로 정의</text></g></svg>