<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">영상 좌표와 배열 인덱스</title><desc id="desc">영상 좌표와 배열 인덱스: 픽셀 좌표 (u, v) → 배열 image[v, u] → 색 채널 계약 → 변환 뒤 검사.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">영상 좌표와 배열 인덱스</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">픽셀 좌표 (u, v)</text><text x="52" y="144" font-size="22">u는 가로, v는 세로</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">배열 image[v, u]</text><text x="52" y="268" font-size="22">행을 먼저, 열을 다음에 읽음</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">색 채널 계약</text><text x="52" y="392" font-size="22">RGB/BGR·dtype·수치 범위</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">변환 뒤 검사</text><text x="52" y="516" font-size="22">필터/특징·라벨의 좌표 일치</text></g></svg>