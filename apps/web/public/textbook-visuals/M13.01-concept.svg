<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">점군 처리 단계가 만드는 다른 집합</title><desc id="desc">점군 처리 단계가 만드는 다른 집합: 원본 점/계약 → 유효값/관심영역 필터 → Voxel 대표점 → 이웃/군집.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">점군 처리 단계가 만드는 다른 집합</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">원본 점/계약</text><text x="52" y="144" font-size="22">센서 frame·m·유효값</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">유효값/관심영역 필터</text><text x="52" y="268" font-size="22">제외한 점과 이유를 남김</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">Voxel 대표점</text><text x="52" y="392" font-size="22">셀 안 관측을 요약한 점</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">이웃/군집</text><text x="52" y="516" font-size="22">계산한 단계의 점 집합을 명시</text></g></svg>