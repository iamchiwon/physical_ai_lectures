<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">RRT는 연결된 트리를 확장한다</title><desc id="desc">RRT는 연결된 트리를 확장한다: 샘플 선택 → 트리의 가까운 노드 → 제한 길이만큼 확장 → 충돌 검사 뒤 추가.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">RRT는 연결된 트리를 확장한다</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">샘플 선택</text><text x="52" y="144" font-size="22">목표 편향 등 선택 규칙</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">트리의 가까운 노드</text><text x="52" y="268" font-size="22">정한 거리로 이웃 검색</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">제한 길이만큼 확장</text><text x="52" y="392" font-size="22">모델에 맞는 국소 연결</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">충돌 검사 뒤 추가</text><text x="52" y="516" font-size="22">새 노드는 기존 트리에 연결</text></g></svg>