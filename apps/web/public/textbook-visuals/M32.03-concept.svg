<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">양팔이 같은 물체를 다루는 기준</title><desc id="desc">양팔이 같은 물체를 다루는 기준: 공통 World/Base → 좌/우 TCP → 물체 강체 관계 → 전체 검수.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">양팔이 같은 물체를 다루는 기준</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">공통 World/Base</text><text x="52" y="144" font-size="22">베이스 pose와 시각을 고정</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">좌/우 TCP</text><text x="52" y="268" font-size="22">각 팔의 도구 오프셋·변환</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">물체 강체 관계</text><text x="52" y="392" font-size="22">두 접촉점의 상대 pose 일치</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">전체 검수</text><text x="52" y="516" font-size="22">충돌·동기·하중 분담을 함께 확인</text></g></svg>