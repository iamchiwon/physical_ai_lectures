<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">변수 노드와 factor의 연결</title><desc id="desc">세pose변수원과중간의제약사각형,첫pose에대한prior.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">변수 노드와 factor의 연결</text><circle cx="110" cy="255" r="27" fill="#dbeafe" fill-opacity="1" stroke="#dbeafe"/><text x="93" y="262" font-size="21">x1</text><circle cx="320" cy="255" r="27" fill="#dbeafe" fill-opacity="1" stroke="#dbeafe"/><text x="303" y="262" font-size="21">x2</text><circle cx="530" cy="255" r="27" fill="#dbeafe" fill-opacity="1" stroke="#dbeafe"/><text x="513" y="262" font-size="21">x3</text><line x1="137" y1="255" x2="200" y2="255" stroke="#52647b" stroke-width="3"/><line x1="230" y1="255" x2="293" y2="255" stroke="#52647b" stroke-width="3"/><rect x="200" y="240" width="30" height="30" fill="#fde68a" stroke="#52647b" stroke-width="2"/><text x="195" y="306" font-size="21">f1</text><line x1="347" y1="255" x2="410" y2="255" stroke="#52647b" stroke-width="3"/><line x1="440" y1="255" x2="503" y2="255" stroke="#52647b" stroke-width="3"/><rect x="410" y="240" width="30" height="30" fill="#fde68a" stroke="#52647b" stroke-width="2"/><text x="405" y="306" font-size="21">f2</text><rect x="95" y="125" width="30" height="30" fill="#fde68a" stroke="#52647b" stroke-width="2"/><line x1="110" y1="155" x2="110" y2="227" stroke="#52647b" stroke-width="3"/><text x="132" y="150" font-size="21">prior</text><text x="60" y="405" font-size="21">원: 추정 변수 / 사각형: 잔차·불확실성의 제약</text><text x="60" y="446" font-size="19">prior는 기준 고정의 한 예: 실제 변수/인자는 모형별</text></g></svg>