<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">요구에서 구현과 시험으로</title><desc id="desc">요구에서 구현과 시험으로: 요구/허용 조건 → HSI → BSW/ASW → 시험/형상 관리.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">요구에서 구현과 시험으로</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">요구/허용 조건</text><text x="52" y="144" font-size="22">측정할 물리량·판정 규칙</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">HSI</text><text x="52" y="268" font-size="22">HW/SW 경계의 의미·단위·시각</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">BSW/ASW</text><text x="52" y="392" font-size="22">장치 기반 기능과 응용 판단</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">시험/형상 관리</text><text x="52" y="516" font-size="22">요구별 원본·결과·미확인을 추적</text></g></svg>