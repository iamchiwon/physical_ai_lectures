<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">관절 끝·도구 끝·물체를 구분</title><desc id="desc">관절 끝·도구 끝·물체를 구분: 마지막 링크 frame → Tool/TCP frame → Camera/Object frame → 변환 합성.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">관절 끝·도구 끝·물체를 구분</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">마지막 링크 frame</text><text x="52" y="144" font-size="22">로봇 모델이 정의한 기준</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">Tool/TCP frame</text><text x="52" y="268" font-size="22">그리퍼 끝의 기준과 오프셋</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">Camera/Object frame</text><text x="52" y="392" font-size="22">센서 관측과 목표 표현</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">변환 합성</text><text x="52" y="516" font-size="22">방향·시각·보정 버전을 함께 사용</text></g></svg>