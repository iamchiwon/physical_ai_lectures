<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">격자의 셀과 지도 좌표</title><desc id="desc">아래에서 위로 증가하는 지도 y축,행 우선 저장 인덱스,빈/점유/미상 셀.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">격자의 셀과 지도 좌표</text><rect x="100" y="345" width="95" height="85" fill="#ffffff" stroke="#52647b" stroke-width="2"/><text x="123" y="394" font-size="21">0</text><rect x="195" y="345" width="95" height="85" fill="#17283e" stroke="#52647b" stroke-width="2"/><text x="218" y="394" font-size="21">1</text><rect x="290" y="345" width="95" height="85" fill="#a5b4c8" stroke="#52647b" stroke-width="2"/><text x="313" y="394" font-size="21">2</text><rect x="385" y="345" width="95" height="85" fill="#ffffff" stroke="#52647b" stroke-width="2"/><text x="408" y="394" font-size="21">3</text><rect x="100" y="260" width="95" height="85" fill="#17283e" stroke="#52647b" stroke-width="2"/><text x="123" y="309" font-size="21">4</text><rect x="195" y="260" width="95" height="85" fill="#a5b4c8" stroke="#52647b" stroke-width="2"/><text x="218" y="309" font-size="21">5</text><rect x="290" y="260" width="95" height="85" fill="#ffffff" stroke="#52647b" stroke-width="2"/><text x="313" y="309" font-size="21">6</text><rect x="385" y="260" width="95" height="85" fill="#17283e" stroke="#52647b" stroke-width="2"/><text x="408" y="309" font-size="21">7</text><rect x="100" y="175" width="95" height="85" fill="#a5b4c8" stroke="#52647b" stroke-width="2"/><text x="123" y="224" font-size="21">8</text><rect x="195" y="175" width="95" height="85" fill="#ffffff" stroke="#52647b" stroke-width="2"/><text x="218" y="224" font-size="21">9</text><rect x="290" y="175" width="95" height="85" fill="#17283e" stroke="#52647b" stroke-width="2"/><text x="313" y="224" font-size="21">10</text><rect x="385" y="175" width="95" height="85" fill="#a5b4c8" stroke="#52647b" stroke-width="2"/><text x="408" y="224" font-size="21">11</text><line x1="80" y1="430" x2="555" y2="430" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><line x1="80" y1="430" x2="80" y2="100" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><text x="553" y="461" font-size="21">x</text><text x="40" y="105" font-size="21">y</text><text x="120" y="99" font-size="21">인덱스 = i + width × j</text><text x="190" y="465" font-size="18">흰색 빈 셀 / 검정 점유 / 회색 미상</text></g></svg>