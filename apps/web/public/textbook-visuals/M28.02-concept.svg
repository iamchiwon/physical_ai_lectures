<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">한 비트 안의 샘플 지점</title><desc id="desc">한 비트 안의 샘플 지점: SYNC 1 TQ → TSEG1 → TSEG2 → SJW.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">한 비트 안의 샘플 지점</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">SYNC 1 TQ</text><text x="52" y="144" font-size="22">비트 시작의 동기 구간</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">TSEG1</text><text x="52" y="268" font-size="22">전파/위상 구간 뒤에서 샘플</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">TSEG2</text><text x="52" y="392" font-size="22">샘플 뒤 남은 구간</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">SJW</text><text x="52" y="516" font-size="22">매 비트 덧붙이는 길이가 아닌 보정 한도</text></g></svg>