<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">IoU는 두 영역의 겹침 비율이다</title><desc id="desc">두예측/정답상자의교집합과합집합을 구분한별도개념도.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">IoU는 두 영역의 겹침 비율이다</text><rect x="90" y="130" width="270" height="220" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="230" y="210" width="270" height="220" fill="#ffedd5" stroke="#d97706" stroke-width="2"/><rect x="230" y="210" width="130" height="140" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/><text x="108" y="116" font-size="21">정답 영역 A</text><text x="365" y="198" font-size="21">예측 영역 B</text><text x="244" y="286" font-size="21">교집합</text><text x="50" y="467" font-size="21">IoU = 교집합 면적 / 합집합 면적</text></g></svg>