<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">벡터의 성분과 길이</title><desc id="desc">동일한 x/y축에서 v=(2,1)m의 화살표와 성분 투영.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">벡터의 성분과 길이</text><line x1="90" y1="380" x2="560" y2="380" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><line x1="90" y1="380" x2="90" y2="90" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><line x1="90" y1="380" x2="330" y2="260" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><line x1="330" y1="260" x2="330" y2="380" stroke="#52647b" stroke-width="3" stroke-dasharray="7 6"/><line x1="90" y1="260" x2="330" y2="260" stroke="#52647b" stroke-width="3" stroke-dasharray="7 6"/><text x="552" y="414" font-size="21">x (m)</text><text x="35" y="88" font-size="21">y (m)</text><text x="198" y="416" font-size="21">2 m</text><text x="23" y="278" font-size="21">1 m</text><text x="345" y="251" font-size="21">v = (2, 1)</text><text x="140" y="220" font-size="21">길이 √5 m</text><text x="90" y="453" font-size="21">같은 기준축과 단위에서 읽은 성분</text></g></svg>