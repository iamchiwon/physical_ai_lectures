<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">장면 계층과 합성 출처</title><desc id="desc">장면 계층과 합성 출처: Stage의 Prim 경로 → Layer의 의견 → Reference → 합성 결과.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">장면 계층과 합성 출처</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">Stage의 Prim 경로</text><text x="52" y="144" font-size="22">장면 안의 구조/대상을 식별</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">Layer의 의견</text><text x="52" y="268" font-size="22">어디에 값이 작성됐는지 기록</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">Reference</text><text x="52" y="392" font-size="22">다른 자산을 구성에 연결</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">합성 결과</text><text x="52" y="516" font-size="22">화면의 최종값과 편집 출처를 구별</text></g></svg>