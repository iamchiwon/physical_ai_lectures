<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">3D 검출과 분할의 출력</title><desc id="desc">3D 검출과 분할의 출력: 3D 검출 → 3D 분할 → 후처리/대응 → 평가 범위.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">3D 검출과 분할의 출력</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">3D 검출</text><text x="52" y="144" font-size="22">물체마다 중심·크기·방향의 상자</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">3D 분할</text><text x="52" y="268" font-size="22">점마다 클래스 또는 개체</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">후처리/대응</text><text x="52" y="392" font-size="22">중복 후보와 정답의 연결 규칙</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">평가 범위</text><text x="52" y="516" font-size="22">거리/가림·희소성별 지표를 분리</text></g></svg>