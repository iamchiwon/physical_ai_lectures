<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">센서 이름보다 측정량을 읽는다</title><desc id="desc">센서 이름보다 측정량을 읽는다: 카메라·깊이 → LiDAR → IMU → GNSS.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">센서 이름보다 측정량을 읽는다</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">카메라·깊이</text><text x="52" y="144" font-size="22">밝기/색과 깊이 축·유효값</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">LiDAR</text><text x="52" y="268" font-size="22">빔의 각도·거리와 취득 시각</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">IMU</text><text x="52" y="392" font-size="22">각속도·가속도계 측정과 축</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">GNSS</text><text x="52" y="516" font-size="22">위치/시각 추정과 기준 좌표</text></g></svg>