<svg xmlns="http://www.w3.org/2000/svg" width="640" height="617" viewBox="0 0 640 617" role="img" aria-labelledby="title desc"><title id="title">URDF와 USD 사이의 보존 계약</title><desc id="desc">URDF와 USD 사이의 보존 계약: 원본 로봇 모델 → 변환 규칙 → 가져온 USD 자산 → 검수.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="617" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">URDF와 USD 사이의 보존 계약</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">원본 로봇 모델</text><text x="52" y="144" font-size="22">링크·관절·축·원점·단위</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">변환 규칙</text><text x="52" y="268" font-size="22">재질·충돌·관성·제한의 대응</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="123" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">가져온 USD 자산</text><text x="52" y="392" font-size="22">stage</text><text x="52" y="421" font-size="22">계층·articulation·구동 경계</text><path d="M314 453v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="481" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="514" font-size="24" font-weight="700">검수</text><text x="52" y="545" font-size="22">표시/FK/물리/제어를 각각 비교</text></g></svg>