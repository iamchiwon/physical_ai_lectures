<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">같은 점, 서로 다른 프레임</title><desc id="desc">A의 축과 위치/방향이 다른 B의 축, 그리고 고정된 점 P.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">같은 점, 서로 다른 프레임</text><line x1="80" y1="390" x2="560" y2="390" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><line x1="80" y1="390" x2="80" y2="80" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><text x="548" y="421" font-size="21">xA</text><text x="32" y="88" font-size="21">yA</text><text x="45" y="424" font-size="21">A</text><line x1="260" y1="300" x2="260" y2="120" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/><line x1="260" y1="300" x2="130" y2="300" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/><text x="270" y="120" font-size="21">xB</text><text x="124" y="287" font-size="21">yB</text><text x="270" y="328" font-size="21">B</text><circle cx="430" cy="170" r="7" fill="#2563eb" fill-opacity="1" stroke="#2563eb"/><text x="441" y="164" font-size="21">P</text><line x1="80" y1="390" x2="430" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><line x1="260" y1="300" x2="430" y2="170" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/><text x="75" y="456" font-size="21">좌표를 바꿔도 물리점 P는 움직이지 않는다</text></g></svg>