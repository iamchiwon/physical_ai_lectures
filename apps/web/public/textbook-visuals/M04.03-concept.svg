<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">PWM 25%와 평균 전압은 다른 파형</title><desc id="desc">0과12V 사이에서 주기25%만 켜지는 PWM과3V 평균선.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">PWM 25%와 평균 전압은 다른 파형</text><line x1="65" y1="365" x2="585" y2="365" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><line x1="65" y1="365" x2="65" y2="90" stroke="#52647b" stroke-width="3" marker-end="url(#a)"/><text x="568" y="400" font-size="21">t</text><text x="17" y="90" font-size="21">V</text><text x="22" y="158" font-size="21">12</text><text x="33" y="370" font-size="21">0</text><line x1="80" y1="365" x2="80" y2="150" stroke="#2563eb" stroke-width="3"/><line x1="80" y1="150" x2="110" y2="150" stroke="#2563eb" stroke-width="3"/><line x1="110" y1="150" x2="110" y2="365" stroke="#2563eb" stroke-width="3"/><line x1="110" y1="365" x2="200" y2="365" stroke="#2563eb" stroke-width="3"/><line x1="200" y1="365" x2="200" y2="150" stroke="#2563eb" stroke-width="3"/><line x1="200" y1="150" x2="230" y2="150" stroke="#2563eb" stroke-width="3"/><line x1="230" y1="150" x2="230" y2="365" stroke="#2563eb" stroke-width="3"/><line x1="230" y1="365" x2="320" y2="365" stroke="#2563eb" stroke-width="3"/><line x1="320" y1="365" x2="320" y2="150" stroke="#2563eb" stroke-width="3"/><line x1="320" y1="150" x2="350" y2="150" stroke="#2563eb" stroke-width="3"/><line x1="350" y1="150" x2="350" y2="365" stroke="#2563eb" stroke-width="3"/><line x1="350" y1="365" x2="440" y2="365" stroke="#2563eb" stroke-width="3"/><line x1="440" y1="365" x2="440" y2="150" stroke="#2563eb" stroke-width="3"/><line x1="440" y1="150" x2="470" y2="150" stroke="#2563eb" stroke-