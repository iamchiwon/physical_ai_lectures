<svg xmlns="http://www.w3.org/2000/svg" width="640" height="617" viewBox="0 0 640 617" role="img" aria-labelledby="title desc"><title id="title">BT와 Action의 서로 다른 상태</title><desc id="desc">BT와 Action의 서로 다른 상태: Behavior Tree → Action 목표 → 미션 상태 → 실제 세계.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="617" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">BT와 Action의 서로 다른 상태</text><rect x="34" y="80" width="558" height="123" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">Behavior Tree</text><text x="52" y="144" font-size="22">노드의</text><text x="52" y="173" font-size="22">SUCCESS/FAILURE/RUNNING</text><rect x="34" y="233" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="266" font-size="24" font-weight="700">Action 목표</text><text x="52" y="297" font-size="22">수락·피드백·결과·취소</text><rect x="34" y="357" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="390" font-size="24" font-weight="700">미션 상태</text><text x="52" y="421" font-size="22">운영자가 정의한 단계</text><rect x="34" y="481" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="514" font-size="24" font-weight="700">실제 세계</text><text x="52" y="545" font-size="22">도착/정지/물체 상태를 별도 관측</text></g></svg>