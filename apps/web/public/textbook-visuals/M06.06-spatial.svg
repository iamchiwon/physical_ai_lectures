<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">세 다리가 같은 플랫폼을 연결</title><desc id="desc">위상만보는델타병렬연결도.세베이스점에서세다리가작은플랫폼을연결.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">세 다리가 같은 플랫폼을 연결</text><line x1="120" y1="120" x2="520" y2="120" stroke="#17283e" stroke-width="12"/><circle cx="160" cy="120" r="11" fill="#17283e" fill-opacity="1" stroke="#17283e"/><line x1="160" y1="120" x2="140" y2="235" stroke="#2563eb" stroke-width="7"/><circle cx="140" cy="235" r="8" fill="#17283e" fill-opacity="1" stroke="#17283e"/><line x1="135" y1="235" x2="270" y2="360" stroke="#059669" stroke-width="3"/><line x1="145" y1="235" x2="280" y2="360" stroke="#059669" stroke-width="3"/><circle cx="320" cy="120" r="11" fill="#17283e" fill-opacity="1" stroke="#17283e"/><line x1="320" y1="120" x2="320" y2="220" stroke="#2563eb" stroke-width="7"/><circle cx="320" cy="220" r="8" fill="#17283e" fill-opacity="1" stroke="#17283e"/><line x1="315" y1="220" x2="315" y2="340" stroke="#059669" stroke-width="3"/><line x1="325" y1="220" x2="325" y2="340" stroke="#059669" stroke-width="3"/><circle cx="480" cy="120" r="11" fill="#17283e" fill-opacity="1" stroke="#17283e"/><line x1="480" y1="120" x2="500" y2="235" stroke="#2563eb" stroke-width="7"/><circle cx="500" cy="235" r="8" fill="#17283e" fill-opacity="1" stroke="#17283e"/><line x1="495" y1="235" x2="360" y2="360" stroke="#059669" stroke-width="3"/><line x1="505" y1="235" x2="370" y2="360" stroke="#059669" stroke-width="3"/><path d="M275 360 L320 340 L365 360 L320 380Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="230" y="92" font-size="21">공통 고정 베이스</text><text x="350" y="407" font-s