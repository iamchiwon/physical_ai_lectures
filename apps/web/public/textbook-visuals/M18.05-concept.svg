<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">다중 로봇의 이름과 공간</title><desc id="desc">다중 로봇의 이름과 공간: Namespace → TF frame ID → 공통 지도 기준 → 통로/충돌 조정.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">다중 로봇의 이름과 공간</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">Namespace</text><text x="52" y="144" font-size="22">같은 이름의 토픽/노드를 분리</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">TF frame ID</text><text x="52" y="268" font-size="22">각 로봇의 변환 트리를 식별</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">공통 지도 기준</text><text x="52" y="392" font-size="22">서로의 pose를 같은 기준에 연결</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">통로/충돌 조정</text><text x="52" y="516" font-size="22">이름 분리만으로 상호 충돌을 막지 못함</text></g></svg>