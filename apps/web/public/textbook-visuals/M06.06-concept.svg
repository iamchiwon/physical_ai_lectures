<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">직렬 사슬과 병렬 연결</title><desc id="desc">직렬 사슬과 병렬 연결: 직렬 팔 → 병렬 델타 → 독립 좌표 → 엔코더 계약.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">직렬 사슬과 병렬 연결</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">직렬 팔</text><text x="52" y="144" font-size="22">베이스 → 관절/링크 → 말단</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">병렬 델타</text><text x="52" y="268" font-size="22">여러 다리가 같은 플랫폼을 연결</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">독립 좌표</text><text x="52" y="392" font-size="22">보이는 관절 수/모터 수와 구별</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">엔코더 계약</text><text x="52" y="516" font-size="22">측정 축·영점·부호·전달비를 명시</text></g></svg>