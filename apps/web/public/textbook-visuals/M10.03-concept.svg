<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">두 표본 사이에서 벽을 넘는 경우</title><desc id="desc">서로 떨어진 두 물체 위치 사이에 얇은 벽이 있어 표본별 겹침만 보면 놓치는 장면.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="480" rx="20" fill="#f5f8fc"/><g font-family="sans-serif" font-size="21" fill="#17283e"><text x="26" y="40" font-size="25" font-weight="bold">두 표본 사이에서 벽을 넘는 경우</text><rect x="310" y="110" width="14" height="270" fill="#a5b4c8" stroke="#52647b" stroke-width="2"/><circle cx="160" cy="245" r="30" fill="#2563eb" fill-opacity="1" stroke="#2563eb"/><circle cx="490" cy="245" r="30" fill="#d97706" fill-opacity="1" stroke="#d97706"/><line x1="192" y1="245" x2="453" y2="245" stroke="#52647b" stroke-width="3" marker-end="url(#a)" stroke-dasharray="7 6"/><text x="90" y="315" font-size="21">표본 k</text><text x="430" y="315" font-size="21">표본 k+1</text><text x="275" y="95" font-size="21">얇은 벽</text><text x="65" y="425" font-size="19">두 위치의 비겹침만으로 구간의 비충돌을 보장 못 함</text></g></svg>