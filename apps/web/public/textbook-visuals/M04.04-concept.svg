<svg xmlns="http://www.w3.org/2000/svg" width="640" height="617" viewBox="0 0 640 617" role="img" aria-labelledby="title desc"><title id="title">SPI와 I2C의 선로 계약</title><desc id="desc">SPI와 I2C의 선로 계약: SPI → I2C/TWI → 각 대상의 명세 → 완료 기록.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="617" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">SPI와 I2C의 선로 계약</text><rect x="34" y="80" width="558" height="123" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">SPI</text><text x="52" y="144" font-size="22">clock·CS·MOSI/MISO·샘플</text><text x="52" y="173" font-size="22">edge</text><rect x="34" y="233" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="266" font-size="24" font-weight="700">I2C/TWI</text><text x="52" y="297" font-size="22">SCL/SDA·주소·방향·ACK</text><rect x="34" y="357" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="390" font-size="24" font-weight="700">각 대상의 명세</text><text x="52" y="421" font-size="22">opcode·레지스터·프레임은 별도</text><rect x="34" y="481" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="514" font-size="24" font-weight="700">완료 기록</text><text x="52" y="545" font-size="22">선로 시간과 처리/대기를 구별</text></g></svg>