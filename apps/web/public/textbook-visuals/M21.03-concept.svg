<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">Action chunk의 겹치는 예측</title><desc id="desc">Action chunk의 겹치는 예측: 한 번의 추론 → 다음 관측의 추론 → 같은 실행 시각끼리 결합 → 실행/관측.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">Action chunk의 겹치는 예측</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">한 번의 추론</text><text x="52" y="144" font-size="22">여러 미래 시각의 행동 묶음</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">다음 관측의 추론</text><text x="52" y="268" font-size="22">겹치는 미래 시각을 다시 예측</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">같은 실행 시각끼리 결합</text><text x="52" y="392" font-size="22">시간 앙상블의 정렬 기준</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">실행/관측</text><text x="52" y="516" font-size="22">새 명령과 실제 상태는 구별</text></g></svg>