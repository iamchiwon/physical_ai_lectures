<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">루프 폐쇄는 새 제약이다</title><desc id="desc">루프 폐쇄는 새 제약이다: 연속 이동 제약 → 누적된 궤적 → 과거 장소 재관측 → 추가 제약/최적화.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">루프 폐쇄는 새 제약이다</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">연속 이동 제약</text><text x="52" y="144" font-size="22">시간상 이웃한 pose 사이 관계</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">누적된 궤적</text><text x="52" y="268" font-size="22">작은 오차가 쌓일 수 있음</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">과거 장소 재관측</text><text x="52" y="392" font-size="22">같은 장소인지 기하 근거 확인</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">추가 제약/최적화</text><text x="52" y="516" font-size="22">전체 관계를 다시 맞춤</text></g></svg>