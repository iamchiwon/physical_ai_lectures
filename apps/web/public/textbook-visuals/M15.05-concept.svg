<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">추정이 끊긴 뒤의 복구 근거</title><desc id="desc">추정이 끊긴 뒤의 복구 근거: IMU/운동 예측 → 외부 관측 → 추적 손실 → 재위치추정.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">추정이 끊긴 뒤의 복구 근거</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">IMU/운동 예측</text><text x="52" y="144" font-size="22">bias와 적분 오차가 누적</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">외부 관측</text><text x="52" y="268" font-size="22">새 정보로 예측에 제약 추가</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">추적 손실</text><text x="52" y="392" font-size="22">연속 예측만으로 참 위치를 단정하지 않음</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">재위치추정</text><text x="52" y="516" font-size="22">지도 대응·유효성·불확실성을 검증</text></g></svg>