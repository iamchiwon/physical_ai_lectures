<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">제어 계층마다 목표 물리량이 다르다</title><desc id="desc">제어 계층마다 목표 물리량이 다르다: 상위 위치 목표 → 속도 제어 경계 → 토크/전류 제어 경계 → 새 상태 관측.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">제어 계층마다 목표 물리량이 다르다</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">상위 위치 목표</text><text x="52" y="144" font-size="22">시간을 붙인 궤적/오차</text><path d="M314 176v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">속도 제어 경계</text><text x="52" y="268" font-size="22">위치 변화율의 목표</text><path d="M314 300v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">토크/전류 제어 경계</text><text x="52" y="392" font-size="22">구동과 관성·마찰·중력의 관계</text><path d="M314 424v24" stroke="#52647b" stroke-width="3" marker-end="url(#arrow)"/><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">새 상태 관측</text><text x="52" y="516" font-size="22">요청과 실제 추종을 같은 시각에 비교</text></g></svg>