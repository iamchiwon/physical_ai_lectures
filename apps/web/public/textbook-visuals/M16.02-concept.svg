<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">점 잔차와 평면 잔차</title><desc id="desc">점 잔차와 평면 잔차: 점-점 → 점-평면 → 기하 퇴화 → 강건 추정.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">점 잔차와 평면 잔차</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">점-점</text><text x="52" y="144" font-size="22">대응 점 사이 벡터의 크기</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">점-평면</text><text x="52" y="268" font-size="22">법선 방향 거리 성분</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">기하 퇴화</text><text x="52" y="392" font-size="22">평면을 따른 이동은 덜 제약될 수 있음</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">강건 추정</text><text x="52" y="516" font-size="22">큰 잔차 영향 감소와 대응 검증은 별개</text></g></svg>