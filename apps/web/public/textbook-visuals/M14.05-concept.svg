<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">어느 표현에서 융합하는가</title><desc id="desc">어느 표현에서 융합하는가: 입력 수준 → 특징 수준 → 결과 수준 → 공통 전제.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">어느 표현에서 융합하는가</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">입력 수준</text><text x="52" y="144" font-size="22">정렬한 관측을 함께 입력</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">특징 수준</text><text x="52" y="268" font-size="22">모달별 표현을 계산한 뒤 결합</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">결과 수준</text><text x="52" y="392" font-size="22">검출/추정 결과를 대응해 결합</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">공통 전제</text><text x="52" y="516" font-size="22">좌표·시간·가용성·독립성 확인</text></g></svg>