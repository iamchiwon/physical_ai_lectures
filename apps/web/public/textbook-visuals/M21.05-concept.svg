<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">양팔과 베이스가 함께 바꾸는 형상</title><desc id="desc">양팔과 베이스가 함께 바꾸는 형상: 이동 베이스 → 왼팔·오른팔 → 운반 물체 → 공통 검수.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52647b"/></marker></defs><rect width="640" height="588" rx="20" fill="#f4f7fb"/><g font-family="sans-serif" fill="#17283e"><text x="28" y="42" font-size="26" font-weight="700">양팔과 베이스가 함께 바꾸는 형상</text><rect x="34" y="80" width="558" height="94" rx="12" fill="#e4efff" stroke="#a5b6cc"/><text x="52" y="113" font-size="24" font-weight="700">이동 베이스</text><text x="52" y="144" font-size="22">전체 팔 기준 위치/방향</text><rect x="34" y="204" width="558" height="94" rx="12" fill="#e4f4ee" stroke="#a5b6cc"/><text x="52" y="237" font-size="24" font-weight="700">왼팔·오른팔</text><text x="52" y="268" font-size="22">공통 물체와 서로의 경로</text><rect x="34" y="328" width="558" height="94" rx="12" fill="#fff1dc" stroke="#a5b6cc"/><text x="52" y="361" font-size="24" font-weight="700">운반 물체</text><text x="52" y="392" font-size="22">접촉/상대 pose·하중 분담</text><rect x="34" y="452" width="558" height="94" rx="12" fill="#eeeafa" stroke="#a5b6cc"/><text x="52" y="485" font-size="24" font-weight="700">공통 검수</text><text x="52" y="516" font-size="22">동일 시각·frame·충돌·구동 한계</text></g></svg>