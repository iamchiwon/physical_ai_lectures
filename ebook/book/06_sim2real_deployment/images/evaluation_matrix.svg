<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="510" viewBox="0 0 1050 510" role="img" aria-labelledby="title desc">
  <title id="title">조건별 Pick and Place 평가 매트릭스</title>
  <desc id="desc">물체 위치와 조명 조건을 교차한 각 셀에서 고정된 반복 횟수, 성공률과 Wilson 신뢰구간, 실패 분류를 기록하는 표</desc>
  <style>.grid{fill:#fff;stroke:#243447;stroke-width:2}.head{fill:#dcecf7;stroke:#243447;stroke-width:2}.good{fill:#e9f5e9;stroke:#243447;stroke-width:2}.warn{fill:#fff2cc;stroke:#243447;stroke-width:2}.bad{fill:#fde2e2;stroke:#243447;stroke-width:2}.h{font:700 19px sans-serif}.t{font:16px sans-serif}.s{font:14px sans-serif}</style>
  <rect width="1050" height="510" fill="white"/>
  <text x="35" y="38" class="h">Stratify conditions; keep every episode</text>
  <rect x="50" y="80" width="190" height="70" class="head"/><text x="93" y="122" class="h">Position \ Light</text>
  <rect x="240" y="80" width="235" height="70" class="head"/><text x="315" y="122" class="h">Baseline</text>
  <rect x="475" y="80" width="235" height="70" class="head"/><text x="548" y="122" class="h">Dim</text>
  <rect x="710" y="80" width="235" height="70" class="head"/><text x="770" y="122" class="h">Side glare</text>
  <rect x="50" y="150" width="190" height="90" class="head"/><text x="112" y="202" class="h">Center</text>
  <rect x="240" y="150" width="235" height="90" class="good"/><text x="295" y="184" class="t">18/20 = 0.90</text><text x="280" y="215" class="s">Wilson CI + failure tags</text>
  <rect x="475" y="150" width="235" height="90" class="good"/><text x="530" y="184" class="t">17/20 = 0.85</text><text x="515" y="215" class="s">grasp(2), timeout(1)</text>
  <rect x="710" y="150" width="235" height="90" class="warn"/><text x="765" y="184" class="t">13/20 = 0.65</text><text x="748" y="215" class="s">vision drift dominates</text>
  <rect x="50" y="240" width="190" height="90" class="head"/><text x="122" y="292" class="h">Left</text>
  <rect x="240" y="240" width="235" height="90" class="good"/><text x="295" y="274" class="t">17/20 = 0.85</text><text x="285" y="305" class="s">all episodes retained</text>
  <rect x="475" y="240" width="235" height="90" class="warn"/><text x="530" y="274" class="t">15/20 = 0.75</text><text x="512" y="305" class="s">pose residual elevated</text>
  <rect x="710" y="240" width="235" height="90" class="bad"/><text x="765" y="274" class="t">9/20 = 0.45</text><text x="755" y="305" class="s">recalibration gate</text>
  <rect x="50" y="330" width="190" height="90" class="head"/><text x="115" y="382" class="h">Reach edge</text>
  <rect x="240" y="330" width="235" height="90" class="warn"/><text x="295" y="364" class="t">14/20 = 0.70</text><text x="283" y="395" class="s">joint limit failures</text>
  <rect x="475" y="330" width="235" height="90" class="bad"/><text x="530" y="364" class="t">10/20 = 0.50</text><text x="512" y="395" class="s">vision + reach coupled</text>
  <rect x="710" y="330" width="235" height="90" class="bad"/><text x="765" y="364" class="t">6/20 = 0.30</text><text x="752" y="395" class="s">outside approved envelope</text>
  <text x="220" y="470" class="t">Counts are illustrative. Fix trial counts and success rules before running the experiment.</text>
</svg>

