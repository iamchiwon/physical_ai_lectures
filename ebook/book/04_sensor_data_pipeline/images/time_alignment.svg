<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">영상과 관절 상태 시간 정합</title><desc id="desc">30 fps 영상 시각 양쪽에 있는 50 Hz 관절 표본을 사용해 관절 위치를 보간한다</desc>
  <style>.t{font:18px sans-serif;fill:#17213a}.n{font:14px sans-serif;fill:#445}.j{fill:#2457a6}.i{fill:#d86b17}</style>
  <text class="t" x="80" y="105">Joint 50 Hz</text><line x1="210" y1="100" x2="940" y2="100" stroke="#445" stroke-width="2"/>
  <text class="t" x="80" y="225">Image 30 fps</text><line x1="210" y1="220" x2="940" y2="220" stroke="#445" stroke-width="2"/>
  <g class="j"><circle cx="260" cy="100" r="7"/><circle cx="400" cy="100" r="7"/><circle cx="540" cy="100" r="7"/><circle cx="680" cy="100" r="7"/><circle cx="820" cy="100" r="7"/></g>
  <g class="i"><rect x="323" y="210" width="20" height="20"/><rect x="553" y="210" width="20" height="20"/><rect x="783" y="210" width="20" height="20"/></g>
  <path d="M400 110L563 205 M540 110L563 205" stroke="#7b5aa6" stroke-width="3" stroke-dasharray="7 5"/>
  <text class="n" x="485" y="155" text-anchor="middle">interpolate q(t_image)</text>
  <path d="M333 240V300H563V240" fill="none" stroke="#d86b17" stroke-width="2"/><text class="n" x="448" y="330" text-anchor="middle">image interval ≈ 33.3 ms</text>
  <text class="n" x="500" y="365" text-anchor="middle">ApproximateTime selects a nearby sample; interpolation estimates the same instant</text>
</svg>

