<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc">
  <title id="title">도메인 랜덤화 폐루프</title><desc id="desc">현실 측정에서 분포를 정의하고 Replicator가 표본과 합성 데이터를 만들며 검증 결과로 분포를 갱신한다</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2457a6"/></marker></defs>
  <style>.b{fill:#eef4ff;stroke:#2457a6;stroke-width:2}.q{fill:#fff3dc;stroke:#a65a00;stroke-width:2}.t{font:18px sans-serif;fill:#17213a}.n{font:14px sans-serif;fill:#445}</style>
  <rect class="b" x="45" y="120" width="170" height="105" rx="12"/><text class="t" x="130" y="159" text-anchor="middle">현실 측정</text><text class="n" x="130" y="188" text-anchor="middle">lighting · friction</text>
  <rect class="b" x="275" y="120" width="170" height="105" rx="12"/><text class="t" x="360" y="159" text-anchor="middle">분포 명세</text><text class="n" x="360" y="188" text-anchor="middle">range · seed · version</text>
  <rect class="b" x="505" y="120" width="170" height="105" rx="12"/><text class="t" x="590" y="159" text-anchor="middle">Replicator</text><text class="n" x="590" y="188" text-anchor="middle">sample · render</text>
  <rect class="q" x="735" y="120" width="190" height="105" rx="12"/><text class="t" x="830" y="159" text-anchor="middle">검증</text><text class="n" x="830" y="188" text-anchor="middle">coverage · reality gap</text>
  <path d="M215 172H270 M445 172H500 M675 172H730" stroke="#2457a6" stroke-width="3" marker-end="url(#a)"/>
  <path d="M830 230V310H360V230" fill="none" stroke="#2457a6" stroke-width="3" marker-end="url(#a)"/>
  <text class="n" x="590" y="345" text-anchor="middle">Update distributions from evidence, not arbitrary wider ranges</text>
</svg>

