<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">URDF에서 USD articulation으로의 변환</title>
  <desc id="desc">URDF의 링크, 관절, 원점, 축, 한계, 질량이 임포터 검사를 거쳐 USD 강체, 물리 관절, articulation root와 drive로 변환되는 흐름</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#222"/></marker><style>.box{fill:#f7fafc;stroke:#243447;stroke-width:3}.head{font:700 21px sans-serif}.txt{font:17px sans-serif}.arrow{stroke:#222;stroke-width:3;marker-end:url(#a)}.check{fill:#fff5d6;stroke:#8a6500;stroke-width:3}</style></defs>
  <rect width="1000" height="460" fill="white"/>
  <text x="40" y="38" class="head">URDF 의미 보존 계약</text>
  <rect x="35" y="75" width="260" height="315" rx="12" class="box"/>
  <text x="65" y="112" class="head">URDF tree</text>
  <text x="65" y="155" class="txt">• link / visual / collision</text><text x="65" y="190" class="txt">• joint parent / child</text><text x="65" y="225" class="txt">• origin xyz / rpy</text><text x="65" y="260" class="txt">• axis and limits</text><text x="65" y="295" class="txt">• mass / inertia</text><text x="65" y="330" class="txt">• mimic / transmissions</text>
  <line x1="300" y1="230" x2="365" y2="230" class="arrow"/>
  <rect x="370" y="105" width="260" height="250" rx="12" class="check"/>
  <text x="402" y="142" class="head">Import + audit</text>
  <text x="400" y="185" class="txt">1. m / rad / stage unit</text><text x="400" y="220" class="txt">2. axis sign and order</text><text x="400" y="255" class="txt">3. fixed or floating root</text><text x="400" y="290" class="txt">4. collision and inertia</text><text x="400" y="325" class="txt">5. drive gains</text>
  <line x1="635" y1="230" x2="700" y2="230" class="arrow"/>
  <rect x="705" y="75" width="260" height="315" rx="12" class="box"/>
  <text x="735" y="112" class="head">USD Physics</text>
  <text x="735" y="155" class="txt">• RigidBodyAPI</text><text x="735" y="190" class="txt">• CollisionAPI</text><text x="735" y="225" class="txt">• RevoluteJoint</text><text x="735" y="260" class="txt">• joint limits</text><text x="735" y="295" class="txt">• DriveAPI</text><text x="735" y="330" class="txt">• ArticulationRootAPI</text>
  <text x="305" y="430" class="txt">변환 성공 ≠ 의미 동일: 작은 양의 관절 시험과 FK 비교로 검증한다.</text>
</svg>

