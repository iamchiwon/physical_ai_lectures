<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="500" viewBox="0 0 1050 500" role="img" aria-labelledby="title desc">
  <title id="title">ROS 2 실물-시뮬레이터 디지털 트윈</title>
  <desc id="desc">Leader와 Follower, 안전 브리지, JointState, robot state publisher, TF, Isaac Sim articulation 간 토픽과 상태 흐름</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#223"/></marker><style>.node{fill:#f1f7fb;stroke:#223;stroke-width:3}.sim{fill:#e8f5e9;stroke:#285c2c;stroke-width:3}.topic{fill:#fff5d6;stroke:#7a6000;stroke-width:3}.t{font:16px sans-serif}.h{font:700 19px sans-serif}.a{stroke:#223;stroke-width:3;marker-end:url(#a);fill:none}.dash{stroke-dasharray:9 7}</style></defs>
  <rect width="1050" height="500" fill="white"/>
  <text x="35" y="38" class="h">Measured state and commanded state remain separate</text>
  <rect x="35" y="90" width="160" height="90" rx="10" class="node"/><text x="77" y="125" class="h">Leader</text><text x="56" y="155" class="t">serial driver</text>
  <rect x="265" y="80" width="210" height="110" rx="10" class="topic"/><text x="300" y="120" class="h">Safety bridge</text><text x="286" y="152" class="t">align / clamp / watchdog</text>
  <rect x="545" y="90" width="180" height="90" rx="10" class="node"/><text x="575" y="125" class="h">Follower</text><text x="568" y="155" class="t">motor driver</text>
  <line x1="195" y1="135" x2="260" y2="135" class="a"/><text x="195" y="115" class="t">leader state</text>
  <line x1="475" y1="135" x2="540" y2="135" class="a"/><text x="480" y="115" class="t">safe command</text>
  <rect x="250" y="270" width="250" height="100" rx="10" class="topic"/><text x="280" y="307" class="h">/follower/joint_states</text><text x="276" y="340" class="t">name + position + stamp</text>
  <path d="M635 180 V235 H430 V265" class="a"/>
  <rect x="35" y="285" width="155" height="80" rx="10" class="node"/><text x="56" y="318" class="h">Monitor</text><text x="52" y="346" class="t">jitter / stale</text>
  <line x1="250" y1="325" x2="195" y2="325" class="a"/>
  <rect x="570" y="270" width="200" height="100" rx="10" class="node"/><text x="590" y="307" class="h">robot_state_</text><text x="605" y="332" class="h">publisher</text><text x="612" y="355" class="t">URDF → TF</text>
  <line x1="500" y1="320" x2="565" y2="320" class="a"/>
  <rect x="835" y="245" width="180" height="145" rx="10" class="sim"/><text x="875" y="285" class="h">Isaac Sim</text><text x="856" y="318" class="t">USD articulation</text><text x="856" y="348" class="t">name/unit map</text><text x="856" y="378" class="t">sim/ TF prefix</text>
  <line x1="770" y1="320" x2="830" y2="320" class="a dash"/><text x="780" y="300" class="t">TF</text>
  <path d="M500 345 H790 V355 H830" class="a"/><text x="640" y="382" class="t">measured joint state</text>
  <text x="250" y="455" class="t">실측(measured), 명령(commanded), 예측(predicted) 상태를 같은 토픽으로 덮어쓰지 않는다.</text>
</svg>

