<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Physical AI 폐루프</title><desc id="desc">환경에서 센서, 인지, 정책, 안전 게이트, 제어기로 흐르고 행동이 다시 환경을 바꾸는 구조</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2457a6"/></marker></defs>
  <style>.b{fill:#eef4ff;stroke:#2457a6;stroke-width:2}.s{fill:#fff3dc;stroke:#a65a00;stroke-width:3}.t{font:18px sans-serif;fill:#17213a}.n{font:14px sans-serif;fill:#445}</style>
  <rect class="b" x="30" y="110" width="135" height="80" rx="12"/><text class="t" x="98" y="143" text-anchor="middle">환경</text><text class="n" x="98" y="168" text-anchor="middle">Environment</text>
  <rect class="b" x="200" y="110" width="135" height="80" rx="12"/><text class="t" x="268" y="143" text-anchor="middle">센서·인지</text><text class="n" x="268" y="168" text-anchor="middle">Perception</text>
  <rect class="b" x="370" y="110" width="135" height="80" rx="12"/><text class="t" x="438" y="143" text-anchor="middle">정책</text><text class="n" x="438" y="168" text-anchor="middle">Policy</text>
  <rect class="s" x="540" y="100" width="150" height="100" rx="12"/><text class="t" x="615" y="140" text-anchor="middle">안전 게이트</text><text class="n" x="615" y="166" text-anchor="middle">limits · TTL</text>
  <rect class="b" x="725" y="110" width="135" height="80" rx="12"/><text class="t" x="793" y="143" text-anchor="middle">저수준 제어</text><text class="n" x="793" y="168" text-anchor="middle">Control</text>
  <path d="M165 150H195 M335 150H365 M505 150H535 M690 150H720" stroke="#2457a6" stroke-width="3" marker-end="url(#a)"/>
  <path d="M860 150H930V270H95V195" fill="none" stroke="#2457a6" stroke-width="3" marker-end="url(#a)"/>
  <text class="n" x="500" y="294" text-anchor="middle">Action changes the next observation</text>
</svg>

