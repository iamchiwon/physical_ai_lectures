<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Physical AI 교과서 학습 경로</title>
  <desc id="desc">시스템 이해에서 시뮬레이션, 로봇 제어, 데이터, VLA 학습, Sim2Real 배포로 이어지는 여섯 단계</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.box{fill:#f8fafc;stroke:#2563eb;stroke-width:3}.n{font:700 25px sans-serif;fill:#1e3a8a}.t{font:600 21px sans-serif;fill:#0f172a}.s{font:17px sans-serif;fill:#334155}.a{stroke:#334155;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="560" fill="white"/>
  <g transform="translate(40 55)"><rect class="box" width="320" height="130" rx="18"/><text class="n" x="22" y="38">1</text><text class="t" x="60" y="38">시스템 기반</text><text class="s" x="22" y="76">Physical AI · OpenUSD</text><text class="s" x="22" y="104">ROS 2 · Isaac Sim</text></g>
  <line class="a" x1="370" y1="120" x2="425" y2="120"/>
  <g transform="translate(440 55)"><rect class="box" width="320" height="130" rx="18"/><text class="n" x="22" y="38">2</text><text class="t" x="60" y="38">물리 시뮬레이션</text><text class="s" x="22" y="76">변환 · 충돌 · 접촉</text><text class="s" x="22" y="104">PhysX · PBR</text></g>
  <line class="a" x1="770" y1="120" x2="825" y2="120"/>
  <g transform="translate(840 55)"><rect class="box" width="320" height="130" rx="18"/><text class="n" x="22" y="38">3</text><text class="t" x="60" y="38">로봇 제어</text><text class="s" x="22" y="76">FK · IK · URDF</text><text class="s" x="22" y="104">Leader-Follower</text></g>
  <line class="a" x1="1000" y1="195" x2="1000" y2="270"/>
  <g transform="translate(840 300)"><rect class="box" width="320" height="130" rx="18"/><text class="n" x="22" y="38">4</text><text class="t" x="60" y="38">데이터 정합</text><text class="s" x="22" y="76">TF2 · 카메라 · 동기화</text><text class="s" x="22" y="104">Domain Randomization</text></g>
  <line class="a" x1="830" y1="365" x2="775" y2="365"/>
  <g transform="translate(440 300)"><rect class="box" width="320" height="130" rx="18"/><text class="n" x="22" y="38">5</text><text class="t" x="60" y="38">VLA 학습</text><text class="s" x="22" y="76">LeRobot Dataset</text><text class="s" x="22" y="104">SmolVLA · LoRA</text></g>
  <line class="a" x1="430" y1="365" x2="375" y2="365"/>
  <g transform="translate(40 300)"><rect class="box" width="320" height="130" rx="18"/><text class="n" x="22" y="38">6</text><text class="t" x="60" y="38">Sim2Real 배포</text><text class="s" x="22" y="76">안전 폐루프 제어</text><text class="s" x="22" y="104">성공률 · 포트폴리오</text></g>
  <text x="600" y="515" text-anchor="middle" class="s">센서 → 정책 → 안전 제약 → 액추에이터 → 환경 → 센서</text>
</svg>

