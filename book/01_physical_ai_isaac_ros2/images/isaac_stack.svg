<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Isaac Sim 소프트웨어 계층</title><desc id="desc">Kit 런타임 위에 OpenUSD, PhysX, RTX 센서, OmniGraph가 있고 ROS 2 브리지가 외부 그래프와 연결된다</desc>
  <style>.l{stroke:#344966;stroke-width:2;rx:10}.t{font:20px sans-serif;fill:#17213a}.n{font:14px sans-serif;fill:#344966}</style>
  <rect class="l" x="90" y="360" width="620" height="70" fill="#dae6f7"/><text class="t" x="400" y="393" text-anchor="middle">Kit Application Runtime</text><text class="n" x="400" y="415" text-anchor="middle">extension · lifecycle · UI · Python</text>
  <rect class="l" x="90" y="245" width="190" height="80" fill="#eef4ff"/><text class="t" x="185" y="280" text-anchor="middle">OpenUSD</text><text class="n" x="185" y="304" text-anchor="middle">scene composition</text>
  <rect class="l" x="305" y="245" width="190" height="80" fill="#fff3dc"/><text class="t" x="400" y="280" text-anchor="middle">PhysX</text><text class="n" x="400" y="304" text-anchor="middle">physics state</text>
  <rect class="l" x="520" y="245" width="190" height="80" fill="#eef8e8"/><text class="t" x="615" y="280" text-anchor="middle">RTX · Sensors</text><text class="n" x="615" y="304" text-anchor="middle">rendered observations</text>
  <rect class="l" x="195" y="125" width="410" height="75" fill="#f1eafa"/><text class="t" x="400" y="158" text-anchor="middle">OmniGraph / Action Graph</text><text class="n" x="400" y="181" text-anchor="middle">execution and data flow</text>
  <rect class="l" x="680" y="125" width="180" height="190" fill="#eaf6f6"/><text class="t" x="770" y="184" text-anchor="middle">ROS 2 Bridge</text><text class="n" x="770" y="214" text-anchor="middle">messages</text><text class="n" x="770" y="238" text-anchor="middle">clock · TF</text><text class="n" x="770" y="262" text-anchor="middle">commands</text>
  <rect class="l" x="680" y="30" width="180" height="55" fill="#fff"/><text class="t" x="770" y="65" text-anchor="middle">ROS 2 Graph</text>
