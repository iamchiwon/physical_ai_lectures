<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-labelledby="title desc">
  <title id="title">안전한 End-to-End Pick and Place 배포 아키텍처</title>
  <desc id="desc">카메라와 언어 입력이 정책, 시간 앙상블, 안전 감독기, 드라이버, SO-101을 거쳐 피드백되고 독립 E-stop이 전원을 차단하는 구조</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#243447"/></marker><style>.b{fill:#eef6fb;stroke:#243447;stroke-width:3}.p{fill:#f0eafa;stroke:#513777;stroke-width:3}.s{fill:#fff2cc;stroke:#7a6000;stroke-width:3}.e{fill:#fde2e2;stroke:#8b1e1e;stroke-width:4}.h{font:700 19px sans-serif}.t{font:15px sans-serif}.a{stroke:#243447;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke-dasharray:9 7}</style></defs>
  <rect width="1160" height="520" fill="white"/>
  <text x="35" y="38" class="h">Natural language chooses a task; safety supervisor owns authority</text>
  <rect x="30" y="85" width="150" height="80" rx="10" class="b"/><text x="73" y="118" class="h">Camera</text><text x="55" y="145" class="t">RGB + timestamp</text>
  <rect x="30" y="205" width="150" height="100" rx="10" class="b"/><text x="60" y="238" class="h">Speech/Text</text><text x="48" y="266" class="t">allowlisted intent</text><text x="48" y="290" class="t">parameter validation</text>
  <rect x="255" y="110" width="180" height="125" rx="10" class="p"/><text x="310" y="145" class="h">Policy</text><text x="280" y="175" class="t">vision + state + task</text><text x="280" y="203" class="t">future action chunk</text>
  <path d="M180 125 H250" class="a"/><path d="M180 255 H220 V200 H250" class="a"/>
  <rect x="500" y="110" width="190" height="125" rx="10" class="p"/><text x="520" y="145" class="h">Temporal filter</text><text x="530" y="175" class="t">overlapping chunks</text><text x="530" y="203" class="t">EMA if justified</text>
  <line x1="435" y1="172" x2="495" y2="172" class="a"/>
  <rect x="755" y="80" width="210" height="185" rx="10" class="s"/><text x="780" y="115" class="h">Safety supervisor</text><text x="780" y="145" class="t">mode + watchdog</text><text x="780" y="172" class="t">joint / rate limits</text><text x="780" y="199" class="t">workspace / collision</text><text x="780" y="226" class="t">latched fault</text>
  <line x1="690" y1="172" x2="750" y2="172" class="a"/>
  <rect x="1025" y="110" width="110" height="125" rx="10" class="b"/><text x="1047" y="145" class="h">Driver</text><text x="1041" y="175" class="t">SO-101</text><text x="1041" y="203" class="t">feedback</text>
  <line x1="965" y1="172" x2="1020" y2="172" class="a"/>
  <path d="M1080 235 V340 H345 V240" class="a d"/><text x="615" y="370" class="t">measured joint state + episode timestamps</text>
  <rect x="750" y="420" width="260" height="70" rx="10" class="e"/><text x="815" y="452" class="h">Physical E-stop</text><text x="790" y="476" class="t">independent power isolation</text>
  <path d="M1010 455 H1080 V240" class="a"/>
</svg>

