<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">작업 셀 좌표계 변환 체인</title>
  <desc id="desc">World에서 Table, Object, Camera 좌표계로 이어지는 변환 관계와 각 좌표축을 보여준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1e5aa8"/></marker>
    <marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker>
    <style>
      .box{fill:#f5f8fc;stroke:#334155;stroke-width:2}.label{font:700 22px sans-serif;fill:#0f172a}.small{font:16px sans-serif;fill:#334155}.edge{fill:none;stroke:#1e5aa8;stroke-width:3;marker-end:url(#arrow)}.axis{stroke-width:3;marker-end:url(#axis)}
    </style>
  </defs>
  <rect width="1100" height="470" fill="white"/>
  <rect class="box" x="55" y="175" rx="12" width="190" height="105"/>
  <text class="label" x="150" y="215" text-anchor="middle">World {W}</text>
  <text class="small" x="150" y="245" text-anchor="middle">Z-up, meter</text>
  <rect class="box" x="330" y="80" rx="12" width="210" height="105"/>
  <text class="label" x="435" y="120" text-anchor="middle">Table {T}</text>
  <text class="small" x="435" y="150" text-anchor="middle">작업대 기준</text>
  <rect class="box" x="655" y="55" rx="12" width="220" height="105"/>
  <text class="label" x="765" y="95" text-anchor="middle">Object {O}</text>
  <text class="small" x="765" y="125" text-anchor="middle">파지 대상체</text>
  <rect class="box" x="655" y="285" rx="12" width="220" height="105"/>
  <text class="label" x="765" y="325" text-anchor="middle">Camera {C}</text>
  <text class="small" x="765" y="355" text-anchor="middle">광학 좌표계</text>
  <path class="edge" d="M245 205 C285 180 295 145 330 135"/>
  <text class="small" x="275" y="155">W T_T</text>
  <path class="edge" d="M540 125 C590 110 610 107 655 107"/>
  <text class="small" x="570" y="90">T T_O</text>
  <path class="edge" d="M245 250 C380 340 520 345 655 337"/>
  <text class="small" x="420" y="365">W T_C</text>
  <path class="edge" d="M765 285 C930 245 930 185 875 140"/>
  <text class="small" x="910" y="220">C T_O</text>
  <g transform="translate(970 365)">
    <line class="axis" x1="0" y1="0" x2="65" y2="0" stroke="#d62828"/><text class="small" x="72" y="6">x</text>
    <line class="axis" x1="0" y1="0" x2="0" y2="-65" stroke="#198754"/><text class="small" x="-5" y="-75">z</text>
    <line class="axis" x1="0" y1="0" x2="-38" y2="38" stroke="#2457c5"/><text class="small" x="-58" y="55">y</text>
  </g>
  <text class="small" x="55" y="430">합성 예: W T_O = W T_T · T T_O</text>
</svg>

