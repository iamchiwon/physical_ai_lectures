<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">좌표 변환 합성을 오른쪽부터 읽는 방법</title>
  <desc id="desc">Object 좌표의 점이 Object에서 Table, Table에서 World 변환을 차례로 거쳐 World 좌표가 되는 흐름이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#155eef"/>
    </marker>
    <style>
      .box{fill:#f4f7fc;stroke:#36516f;stroke-width:2}.frame{fill:#eaf1ff;stroke:#155eef;stroke-width:2}.title{font:700 24px sans-serif;fill:#102a56}.body{font:18px sans-serif;fill:#334155}.math{font:italic 21px serif;fill:#102a56}.arrow{stroke:#155eef;stroke-width:3;fill:none;marker-end:url(#arrow)}.hint{font:700 17px sans-serif;fill:#155eef}
    </style>
  </defs>
  <rect width="1100" height="360" fill="white"/>
  <text class="title" x="550" y="42" text-anchor="middle">점에 가까운 변환부터 적용한다</text>
  <rect class="box" x="55" y="115" width="230" height="100" rx="14"/>
  <text class="body" x="170" y="153" text-anchor="middle">Object의 점</text>
  <text class="math" x="170" y="188" text-anchor="middle">p in {O}</text>
  <rect class="frame" x="420" y="115" width="230" height="100" rx="14"/>
  <text class="body" x="535" y="153" text-anchor="middle">Table 표현</text>
  <text class="math" x="535" y="188" text-anchor="middle">p in {T}</text>
  <rect class="box" x="815" y="115" width="230" height="100" rx="14"/>
  <text class="body" x="930" y="153" text-anchor="middle">World 표현</text>
  <text class="math" x="930" y="188" text-anchor="middle">p in {W}</text>
  <path class="arrow" d="M285 165 H410"/>
  <text class="math" x="347" y="142" text-anchor="middle">T from O</text>
  <path class="arrow" d="M650 165 H805"/>
  <text class="math" x="727" y="142" text-anchor="middle">W from T</text>
  <text class="hint" x="550" y="270" text-anchor="middle">계산 순서: 오른쪽 → 왼쪽</text>
  <text class="math" x="550" y="312" text-anchor="middle">p in {W} = (W from T) · (T from O) · p in {O}</text>
</svg>
